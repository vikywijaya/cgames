<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1"/>
    </linearGradient>
    <!-- Tile gradients: highlighted (tapped) -->
    <linearGradient id="tileTapped1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tileTapped2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tileTapped3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <!-- Tile gradients: normal/dim -->
    <linearGradient id="tileDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3561;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2244;stop-opacity:1"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#43e97b;stop-opacity:1"/>
    </linearGradient>
    <filter id="tileGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Stars background -->
  <circle cx="48" cy="70" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="460" cy="85" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="490" cy="200" r="1" fill="white" opacity="0.35"/>
  <circle cx="22" cy="300" r="1" fill="white" opacity="0.3"/>
  <circle cx="475" cy="430" r="1.5" fill="white" opacity="0.35"/>

  <!-- Title banner -->
  <rect x="40" y="34" width="432" height="68" rx="18" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="80" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#titleGlow)">NUMBER SORT</text>

  <!-- Ascending arrow (background, large) -->
  <g opacity="0.12">
    <polygon points="256,138 306,210 280,210 280,420 232,420 232,210 206,210" fill="url(#arrowGrad)"/>
  </g>

  <!-- === NUMBER TILES (5 tiles in a row) === -->
  <!-- Layout: 5 tiles, each 78x88, gap=10, total=5*78+4*10=430, start x=(512-430)/2=41 -->
  <!-- Tile y: centered vertically, row 1 y=310, row 2 (top row) y=200 -->

  <!-- === TOP ROW: random order display === -->
  <!-- Tile 3 (dim, center top) -->
  <rect x="197" y="190" width="118" height="96" rx="18" fill="url(#tileDim)" filter="url(#shadow)"/>
  <rect x="197" y="190" width="118" height="96" rx="18" fill="none" stroke="#3d5af1" stroke-width="1.5" opacity="0.4"/>
  <text x="256" y="256" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#6b7db3" text-anchor="middle" opacity="0.7">3</text>

  <!-- === BOTTOM ROW: sorted tiles in tap order === -->
  <!-- Tile spacing: 5 tiles across 512 with padding -->
  <!-- x positions: 26, 120, 214, 308, 402 for width 82 each, gap 8 -->

  <!-- Tile 1 - TAPPED (green glow) -->
  <rect x="26" y="326" width="82" height="90" rx="16" fill="url(#tileTapped1)" filter="url(#tileGlow)"/>
  <rect x="26" y="326" width="82" height="90" rx="16" fill="none" stroke="#43e97b" stroke-width="2.5" opacity="0.9"/>
  <text x="67" y="392" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" filter="url(#tileGlow)">1</text>
  <!-- Tap checkmark -->
  <circle cx="98" cy="338" r="13" fill="#ffffff"/>
  <path d="M91,338 L96,344 L106,332" stroke="#43e97b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tile 2 - TAPPED (blue glow) -->
  <rect x="120" y="326" width="82" height="90" rx="16" fill="url(#tileTapped2)" filter="url(#tileGlow)"/>
  <rect x="120" y="326" width="82" height="90" rx="16" fill="none" stroke="#4facfe" stroke-width="2.5" opacity="0.9"/>
  <text x="161" y="392" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" filter="url(#tileGlow)">2</text>
  <circle cx="192" cy="338" r="13" fill="#ffffff"/>
  <path d="M185,338 L190,344 L200,332" stroke="#4facfe" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tile 3 - ACTIVE/CURRENT (pink glow, pulsing) -->
  <rect x="214" y="318" width="84" height="96" rx="16" fill="url(#tileTapped3)" filter="url(#bigGlow)"/>
  <rect x="214" y="318" width="84" height="96" rx="16" fill="none" stroke="#f093fb" stroke-width="3" opacity="0.95"/>
  <text x="256" y="392" font-family="Arial Black, Arial" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" filter="url(#bigGlow)">3</text>
  <!-- Active indicator ring -->
  <rect x="208" y="312" width="96" height="108" rx="20" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.5"/>

  <!-- Tile 4 - dim/unselected -->
  <rect x="308" y="326" width="82" height="90" rx="16" fill="url(#tileDim)" filter="url(#shadow)"/>
  <rect x="308" y="326" width="82" height="90" rx="16" fill="none" stroke="#3d5af1" stroke-width="1.5" opacity="0.4"/>
  <text x="349" y="392" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#6b7db3" text-anchor="middle" opacity="0.7">4</text>

  <!-- Tile 5 - dim/unselected -->
  <rect x="402" y="326" width="82" height="90" rx="16" fill="url(#tileDim)" filter="url(#shadow)"/>
  <rect x="402" y="326" width="82" height="90" rx="16" fill="none" stroke="#3d5af1" stroke-width="1.5" opacity="0.4"/>
  <text x="443" y="392" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#6b7db3" text-anchor="middle" opacity="0.7">5</text>

  <!-- Ascending arrow indicator -->
  <g transform="translate(256,450)" opacity="0.8">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="url(#arrowGrad)" stroke-width="3"/>
    <!-- Arrowhead right -->
    <polygon points="90,0 72,-8 72,8" fill="#43e97b" opacity="0.9"/>
    <!-- Small numbers on line -->
    <text x="-80" y="-8" font-family="Arial" font-size="12" fill="#43e97b" text-anchor="middle" opacity="0.7">1</text>
    <text x="-40" y="-8" font-family="Arial" font-size="12" fill="#4facfe" text-anchor="middle" opacity="0.7">2</text>
    <text x="0" y="-8" font-family="Arial" font-size="12" fill="#f093fb" text-anchor="middle" opacity="0.7">3</text>
    <text x="40" y="-8" font-family="Arial" font-size="12" fill="#6b7db3" text-anchor="middle" opacity="0.5">4</text>
    <text x="80" y="-8" font-family="Arial" font-size="12" fill="#6b7db3" text-anchor="middle" opacity="0.5">5</text>
  </g>

  <!-- Hint text -->
  <text x="256" y="490" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.4" letter-spacing="1">TAP SMALLEST TO LARGEST</text>

  <!-- Border -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.07"/>
</svg>
