<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe566;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5fffb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c97a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a7e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252560;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffe566;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5fffb0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tileGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle center glow -->
  <radialGradient id="cGlow" cx="50%" cy="54%" r="48%">
    <stop offset="0%" style="stop-color:#2e2e9e;stop-opacity:0.5" />
    <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:0" />
  </radialGradient>
  <rect width="512" height="512" rx="90" ry="90" fill="url(#cGlow)"/>

  <!-- Title "SUMIX" at top -->
  <rect x="80" y="46" width="352" height="62" rx="14" ry="14"
        fill="#ffffff" opacity="0.08"/>
  <text x="256" y="92" font-family="Arial Black, Arial" font-size="44" font-weight="900"
        fill="url(#titleGrad)" text-anchor="middle" letter-spacing="8"
        filter="url(#goldGlow)">SUMIX</text>

  <!-- === 3x3 GRID === -->
  <!-- Grid container background -->
  <rect x="108" y="142" width="264" height="248" rx="20" ry="20"
        fill="#0a0a30" opacity="0.5"/>

  <!-- TILE DEFINITIONS: row1=inactive, row2=mix, row3=inactive -->
  <!-- Cell size: 76x76, gap: 12, start: x=120, y=154 -->

  <!-- Row 1 -->
  <!-- Cell (0,0) inactive -->
  <rect x="120" y="154" width="76" height="76" rx="12" ry="12" fill="url(#dimGrad)"
        stroke="#4a4a9e" stroke-width="1.5"/>
  <text x="158" y="202" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#8888cc" text-anchor="middle">4</text>

  <!-- Cell (0,1) GOLD active -->
  <rect x="208" y="154" width="76" height="76" rx="12" ry="12" fill="url(#goldGrad)"
        filter="url(#tileGlow)"/>
  <rect x="208" y="154" width="76" height="76" rx="12" ry="12"
        fill="none" stroke="#fff8b0" stroke-width="2" opacity="0.7"/>
  <text x="246" y="202" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#3a1a00" text-anchor="middle">7</text>

  <!-- Cell (0,2) inactive -->
  <rect x="296" y="154" width="76" height="76" rx="12" ry="12" fill="url(#dimGrad)"
        stroke="#4a4a9e" stroke-width="1.5"/>
  <text x="334" y="202" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#8888cc" text-anchor="middle">2</text>

  <!-- Row sum target label -->
  <rect x="382" y="163" width="40" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="402" y="183" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">13</text>

  <!-- Row 2 -->
  <!-- Cell (1,0) GREEN active -->
  <rect x="120" y="242" width="76" height="76" rx="12" ry="12" fill="url(#greenGrad)"
        filter="url(#tileGlow)"/>
  <rect x="120" y="242" width="76" height="76" rx="12" ry="12"
        fill="none" stroke="#b0ffe8" stroke-width="2" opacity="0.7"/>
  <text x="158" y="290" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#00301a" text-anchor="middle">5</text>

  <!-- Cell (1,1) inactive -->
  <rect x="208" y="242" width="76" height="76" rx="12" ry="12" fill="url(#dimGrad)"
        stroke="#4a4a9e" stroke-width="1.5"/>
  <text x="246" y="290" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#8888cc" text-anchor="middle">3</text>

  <!-- Cell (1,2) GOLD active -->
  <rect x="296" y="242" width="76" height="76" rx="12" ry="12" fill="url(#goldGrad)"
        filter="url(#tileGlow)"/>
  <rect x="296" y="242" width="76" height="76" rx="12" ry="12"
        fill="none" stroke="#fff8b0" stroke-width="2" opacity="0.7"/>
  <text x="334" y="290" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#3a1a00" text-anchor="middle">6</text>

  <!-- Row sum target label -->
  <rect x="382" y="251" width="40" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="402" y="271" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">11</text>

  <!-- Row 3 -->
  <!-- Cell (2,0) inactive -->
  <rect x="120" y="330" width="76" height="76" rx="12" ry="12" fill="url(#dimGrad)"
        stroke="#4a4a9e" stroke-width="1.5"/>
  <text x="158" y="378" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#8888cc" text-anchor="middle">8</text>

  <!-- Cell (2,1) GREEN active -->
  <rect x="208" y="330" width="76" height="76" rx="12" ry="12" fill="url(#greenGrad)"
        filter="url(#tileGlow)"/>
  <rect x="208" y="330" width="76" height="76" rx="12" ry="12"
        fill="none" stroke="#b0ffe8" stroke-width="2" opacity="0.7"/>
  <text x="246" y="378" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#00301a" text-anchor="middle">9</text>

  <!-- Cell (2,2) inactive -->
  <rect x="296" y="330" width="76" height="76" rx="12" ry="12" fill="url(#dimGrad)"
        stroke="#4a4a9e" stroke-width="1.5"/>
  <text x="334" y="378" font-family="Arial Black, Arial" font-size="28" font-weight="900"
        fill="#8888cc" text-anchor="middle">1</text>

  <!-- Row sum target label -->
  <rect x="382" y="339" width="40" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="402" y="359" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">17</text>

  <!-- Column sum targets (bottom) -->
  <rect x="120" y="416" width="76" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="158" y="436" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">17</text>

  <rect x="208" y="416" width="76" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="246" y="436" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">19</text>

  <rect x="296" y="416" width="76" height="30" rx="8" ry="8"
        fill="#ffffff" opacity="0.12"/>
  <text x="334" y="436" font-family="Arial Black, Arial" font-size="14" font-weight="700"
        fill="#aad4ff" text-anchor="middle">9</text>

  <!-- Bottom decorative bar -->
  <rect x="130" y="460" width="252" height="4" rx="2"
        fill="url(#titleGrad)" opacity="0.6"/>

  <!-- "SUM TO WIN" tagline -->
  <text x="256" y="488" font-family="Arial, sans-serif" font-size="16" font-weight="700"
        fill="#aad4ff" text-anchor="middle" opacity="0.75" letter-spacing="2">SUM TO WIN</text>
</svg>
