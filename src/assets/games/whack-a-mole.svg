<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1"/>
    </linearGradient>
    <!-- Grass gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388e3c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1"/>
    </linearGradient>
    <!-- Mole body gradient -->
    <radialGradient id="moleBody" cx="40%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#a0724a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6d4c2a;stop-opacity:1"/>
    </radialGradient>
    <!-- Mole face -->
    <radialGradient id="moleFace" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#f5c9a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d4956a;stop-opacity:1"/>
    </radialGradient>
    <!-- Hole gradient -->
    <radialGradient id="holeGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#3e2723;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a0a00;stop-opacity:1"/>
    </radialGradient>
    <!-- Impact star gradient -->
    <radialGradient id="impactGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#ffeb3b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:0.8"/>
    </radialGradient>
    <!-- Hammer gradient -->
    <linearGradient id="hammerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7f0000;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="80" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="180" cy="45" r="1" fill="white" opacity="0.3"/>
  <circle cx="430" cy="60" r="2" fill="white" opacity="0.35"/>
  <circle cx="480" cy="150" r="1" fill="white" opacity="0.3"/>
  <circle cx="25" cy="200" r="1.5" fill="white" opacity="0.3"/>

  <!-- Title banner -->
  <rect x="30" y="34" width="452" height="70" rx="18" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="80" font-family="Arial Black, Arial" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">WHACK-A-MOLE</text>

  <!-- Ground area -->
  <rect x="0" y="340" width="512" height="172" rx="0" fill="url(#groundGrad)"/>
  <!-- Grass strip -->
  <rect x="0" y="333" width="512" height="30" rx="0" fill="url(#grassGrad)"/>
  <!-- Grass blades -->
  <g fill="#4caf50" opacity="0.8">
    <ellipse cx="20" cy="335" rx="5" ry="14" transform="rotate(-15,20,335)"/>
    <ellipse cx="40" cy="333" rx="5" ry="16" transform="rotate(10,40,333)"/>
    <ellipse cx="65" cy="336" rx="5" ry="15" transform="rotate(-8,65,336)"/>
    <ellipse cx="90" cy="334" rx="5" ry="14" transform="rotate(12,90,334)"/>
    <ellipse cx="115" cy="335" rx="5" ry="16" transform="rotate(-10,115,335)"/>
    <ellipse cx="140" cy="333" rx="5" ry="15" transform="rotate(7,140,333)"/>
    <ellipse cx="165" cy="336" rx="5" ry="14" transform="rotate(-12,165,336)"/>
    <ellipse cx="190" cy="334" rx="5" ry="16" transform="rotate(9,190,334)"/>
    <ellipse cx="215" cy="335" rx="5" ry="15" transform="rotate(-7,215,335)"/>
    <ellipse cx="240" cy="333" rx="5" ry="14" transform="rotate(11,240,333)"/>
    <ellipse cx="265" cy="336" rx="5" ry="16" transform="rotate(-9,265,336)"/>
    <ellipse cx="290" cy="334" rx="5" ry="15" transform="rotate(8,290,334)"/>
    <ellipse cx="315" cy="335" rx="5" ry="14" transform="rotate(-11,315,335)"/>
    <ellipse cx="340" cy="333" rx="5" ry="16" transform="rotate(6,340,333)"/>
    <ellipse cx="365" cy="336" rx="5" ry="15" transform="rotate(-13,365,336)"/>
    <ellipse cx="390" cy="334" rx="5" ry="14" transform="rotate(10,390,334)"/>
    <ellipse cx="415" cy="335" rx="5" ry="16" transform="rotate(-8,415,335)"/>
    <ellipse cx="440" cy="333" rx="5" ry="15" transform="rotate(11,440,333)"/>
    <ellipse cx="465" cy="336" rx="5" ry="14" transform="rotate(-10,465,336)"/>
    <ellipse cx="490" cy="334" rx="5" ry="16" transform="rotate(7,490,334)"/>
  </g>

  <!-- Side holes (smaller, empty) -->
  <!-- Left hole -->
  <ellipse cx="100" cy="375" rx="55" ry="22" fill="url(#holeGrad)"/>
  <ellipse cx="100" cy="368" rx="55" ry="14" fill="#3e2723" opacity="0.6"/>
  <!-- Right hole -->
  <ellipse cx="412" cy="375" rx="55" ry="22" fill="url(#holeGrad)"/>
  <ellipse cx="412" cy="368" rx="55" ry="14" fill="#3e2723" opacity="0.6"/>

  <!-- Center main hole (bigger) -->
  <ellipse cx="256" cy="390" rx="80" ry="30" fill="url(#holeGrad)"/>
  <ellipse cx="256" cy="380" rx="80" ry="20" fill="#1a0a00" opacity="0.7"/>

  <!-- Mole body (peeking out of center hole) -->
  <!-- Body clipped below hole line -->
  <ellipse cx="256" cy="320" rx="68" ry="80" fill="url(#moleBody)" filter="url(#shadow)"/>
  <!-- Belly -->
  <ellipse cx="256" cy="335" rx="42" ry="55" fill="#f5deb3" opacity="0.7"/>
  <!-- Face -->
  <ellipse cx="256" cy="280" rx="52" ry="48" fill="url(#moleFace)"/>
  <!-- Eyes -->
  <circle cx="238" cy="265" r="10" fill="white"/>
  <circle cx="274" cy="265" r="10" fill="white"/>
  <circle cx="241" cy="267" r="6" fill="#1a1a1a"/>
  <circle cx="277" cy="267" r="6" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="244" cy="264" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="280" cy="264" r="2.5" fill="white" opacity="0.9"/>
  <!-- Nose -->
  <ellipse cx="256" cy="284" rx="10" ry="7" fill="#c0392b"/>
  <!-- Nostrils -->
  <circle cx="251" cy="283" r="2.5" fill="#922b21" opacity="0.7"/>
  <circle cx="261" cy="283" r="2.5" fill="#922b21" opacity="0.7"/>
  <!-- Mouth smile -->
  <path d="M238 295 Q256 310 274 295" stroke="#7f3b08" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="208" cy="250" rx="16" ry="20" fill="#a0724a"/>
  <ellipse cx="304" cy="250" rx="16" ry="20" fill="#a0724a"/>
  <ellipse cx="208" cy="250" rx="9" ry="12" fill="#f5c9a0" opacity="0.6"/>
  <ellipse cx="304" cy="250" rx="9" ry="12" fill="#f5c9a0" opacity="0.6"/>
  <!-- Claws/paws peeking -->
  <ellipse cx="196" cy="345" rx="22" ry="14" fill="#a0724a"/>
  <ellipse cx="316" cy="345" rx="22" ry="14" fill="#a0724a"/>
  <!-- Claw lines -->
  <g stroke="#6d4c2a" stroke-width="2" fill="none">
    <line x1="188" y1="344" x2="184" y2="353"/>
    <line x1="196" y1="344" x2="194" y2="355"/>
    <line x1="204" y1="344" x2="206" y2="353"/>
    <line x1="308" y1="344" x2="306" y2="353"/>
    <line x1="316" y1="344" x2="316" y2="355"/>
    <line x1="324" y1="344" x2="326" y2="353"/>
  </g>

  <!-- Hole rim over mole (depth effect) -->
  <ellipse cx="256" cy="370" rx="80" ry="20" fill="#3e2723" opacity="0.5"/>

  <!-- Impact / hit star burst (top-right of mole) -->
  <g transform="translate(340,210)" filter="url(#glow)">
    <!-- Outer glow ring -->
    <circle r="58" fill="#ff6f00" opacity="0.25"/>
    <!-- 12-point star -->
    <polygon points="0,-55 7,-20 25,-35 18,-8 55,0 18,8 25,35 7,20 0,55 -7,20 -25,35 -18,8 -55,0 -18,-8 -25,-35 -7,-20"
             fill="url(#impactGrad)" opacity="0.95"/>
    <!-- Inner 8-point star -->
    <polygon points="0,-32 6,-12 18,-18 12,-6 32,0 12,6 18,18 6,12 0,32 -6,12 -18,18 -12,6 -32,0 -12,-6 -18,-18 -6,-12"
             fill="#ffffff" opacity="0.85"/>
    <!-- Center -->
    <circle r="12" fill="#ffeb3b"/>
    <!-- POW text -->
    <text x="0" y="5" font-family="Arial Black, Arial" font-weight="900" font-size="13" fill="#c62828" text-anchor="middle">POW!</text>
  </g>

  <!-- Hammer -->
  <g transform="translate(395,145) rotate(40)">
    <!-- Handle -->
    <rect x="-5" y="-5" width="10" height="70" rx="4" fill="#8d6e63"/>
    <!-- Head -->
    <rect x="-22" y="-42" width="44" height="30" rx="6" fill="url(#hammerGrad)"/>
    <!-- Head highlight -->
    <rect x="-20" y="-40" width="42" height="8" rx="3" fill="#ef5350" opacity="0.5"/>
    <!-- Grip wrap -->
    <g stroke="#6d4c41" stroke-width="2" fill="none" opacity="0.6">
      <line x1="-4" y1="20" x2="4" y2="20"/>
      <line x1="-4" y1="30" x2="4" y2="30"/>
      <line x1="-4" y1="40" x2="4" y2="40"/>
    </g>
  </g>

  <!-- Border glow -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.08"/>
</svg>
