<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1"/>
    </linearGradient>
    <!-- Word card gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a3a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a4a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1a3a;stop-opacity:1"/>
    </linearGradient>
    <!-- Arrow gradients -->
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff5252;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle dot pattern background -->
  <g fill="white" opacity="0.04">
    <circle cx="80" cy="130" r="2"/><circle cx="160" cy="130" r="2"/><circle cx="240" cy="130" r="2"/>
    <circle cx="320" cy="130" r="2"/><circle cx="400" cy="130" r="2"/><circle cx="480" cy="130" r="2"/>
    <circle cx="80" cy="210" r="2"/><circle cx="160" cy="210" r="2"/><circle cx="240" cy="210" r="2"/>
    <circle cx="320" cy="210" r="2"/><circle cx="400" cy="210" r="2"/><circle cx="480" cy="210" r="2"/>
    <circle cx="80" cy="370" r="2"/><circle cx="160" cy="370" r="2"/><circle cx="240" cy="370" r="2"/>
    <circle cx="320" cy="370" r="2"/><circle cx="400" cy="370" r="2"/><circle cx="480" cy="370" r="2"/>
    <circle cx="80" cy="450" r="2"/><circle cx="160" cy="450" r="2"/><circle cx="240" cy="450" r="2"/>
    <circle cx="320" cy="450" r="2"/><circle cx="400" cy="450" r="2"/><circle cx="480" cy="450" r="2"/>
  </g>

  <!-- STROOP title banner -->
  <rect x="60" y="32" width="392" height="70" rx="18" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="79" font-family="Arial Black, Arial" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">STROOP</text>

  <!-- Subtitle -->
  <text x="256" y="115" font-family="Arial, sans-serif" font-size="15" fill="#90caf9" text-anchor="middle" opacity="0.85" letter-spacing="1">COLOUR CHALLENGE</text>

  <!-- === WORD CARD 1: "RED" written in BLUE ink === -->
  <rect x="56" y="148" width="400" height="115" rx="20" fill="url(#cardGrad1)" filter="url(#cardShadow)"/>
  <rect x="56" y="148" width="400" height="115" rx="20" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0.7"/>
  <!-- Ink colour label (top left of card) -->
  <text x="78" y="173" font-family="Arial, sans-serif" font-size="13" fill="#90caf9" opacity="0.6" letter-spacing="1">INK COLOR ↓</text>
  <!-- The word RED written in BLUE -->
  <text x="256" y="242" font-family="Arial Black, Arial" font-weight="900" font-size="80" fill="#2196F3" text-anchor="middle" filter="url(#textGlow)" letter-spacing="6">RED</text>
  <!-- Conflict marker -->
  <text x="430" y="225" font-family="Arial, sans-serif" font-size="24" fill="#ff5252" opacity="0.8">≠</text>

  <!-- VS separator with arrows -->
  <g transform="translate(256,295)" opacity="0.9">
    <!-- Left arrow (red, pointing left) -->
    <polygon points="-80,0 -50,-12 -50,-5 -10,-5 -10,5 -50,5 -50,12" fill="url(#arrowGrad1)" opacity="0.8"/>
    <!-- Right arrow (blue, pointing right) -->
    <polygon points="80,0 50,12 50,5 10,5 10,-5 50,-5 50,-12" fill="url(#arrowGrad2)" opacity="0.8"/>
    <!-- VS circle -->
    <circle r="22" fill="#1a1a4e" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <text x="0" y="7" font-family="Arial Black, Arial" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">VS</text>
  </g>

  <!-- === WORD CARD 2: "BLUE" written in RED ink === -->
  <rect x="56" y="322" width="400" height="115" rx="20" fill="url(#cardGrad2)" filter="url(#cardShadow)"/>
  <rect x="56" y="322" width="400" height="115" rx="20" fill="none" stroke="#e53935" stroke-width="2.5" opacity="0.7"/>
  <text x="78" y="347" font-family="Arial, sans-serif" font-size="13" fill="#ef9a9a" opacity="0.6" letter-spacing="1">INK COLOR ↓</text>
  <!-- The word BLUE written in RED -->
  <text x="256" y="413" font-family="Arial Black, Arial" font-weight="900" font-size="72" fill="#f44336" text-anchor="middle" filter="url(#textGlow)" letter-spacing="4">BLUE</text>
  <!-- Conflict marker -->
  <text x="430" y="395" font-family="Arial, sans-serif" font-size="24" fill="#2196F3" opacity="0.8">≠</text>

  <!-- Bottom hint text -->
  <text x="256" y="472" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.5" letter-spacing="1">TAP THE INK COLOR, NOT THE WORD</text>

  <!-- Border -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.07"/>
</svg>
