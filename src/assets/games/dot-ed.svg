<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6bd4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6bd4ff;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6bd4ff;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#ff9999;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#99ddff;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6bd4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow -->
  <radialGradient id="cGlow" cx="50%" cy="55%" r="52%">
    <stop offset="0%" style="stop-color:#1a2a6e;stop-opacity:0.7" />
    <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:0" />
  </radialGradient>
  <rect width="512" height="512" rx="90" ry="90" fill="url(#cGlow)"/>

  <!-- Grid dots (background decoration) -->
  <!-- Very subtle grid of tiny dots for "graph paper" feel -->
  <!-- Row 1 -->
  <circle cx="90" cy="170" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="170" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="250" cy="170" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="330" cy="170" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="410" cy="170" r="2" fill="#ffffff" opacity="0.12"/>
  <!-- Row 2 -->
  <circle cx="90" cy="250" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="250" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="250" cy="250" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="330" cy="250" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="410" cy="250" r="2" fill="#ffffff" opacity="0.12"/>
  <!-- Row 3 -->
  <circle cx="90" cy="330" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="330" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="250" cy="330" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="330" cy="330" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="410" cy="330" r="2" fill="#ffffff" opacity="0.12"/>
  <!-- Row 4 -->
  <circle cx="90" cy="410" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="170" cy="410" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="250" cy="410" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="330" cy="410" r="2" fill="#ffffff" opacity="0.12"/>
  <circle cx="410" cy="410" r="2" fill="#ffffff" opacity="0.12"/>

  <!-- Title "DOT.ED" -->
  <rect x="100" y="46" width="312" height="62" rx="14" ry="14"
        fill="#ffffff" opacity="0.07"/>
  <text x="256" y="92" font-family="Arial Black, Arial" font-size="44" font-weight="900"
        fill="url(#titleGrad)" text-anchor="middle" letter-spacing="6"
        filter="url(#titleGlow)">DOT.ED</text>

  <!-- === CONNECTIONS (lines drawn first, beneath dots) === -->

  <!-- Line: Red(148,200) --> Blue(350,290) -->
  <line x1="148" y1="200" x2="350" y2="290"
        stroke="url(#lineGrad1)" stroke-width="4" stroke-linecap="round"
        filter="url(#lineGlow)" opacity="0.9"/>

  <!-- Line: Red(120,330) --> Blue(380,220) (cross connection) -->
  <line x1="120" y1="330" x2="380" y2="220"
        stroke="url(#lineGrad2)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#lineGlow)" opacity="0.75"/>

  <!-- Line: Red(260,380) --> Blue(400,360) -->
  <line x1="260" y1="380" x2="400" y2="360"
        stroke="url(#lineGrad3)" stroke-width="3" stroke-linecap="round"
        filter="url(#lineGlow)" opacity="0.8"/>

  <!-- Line: Red(148,200) --> Blue(130,310) (short hop) -->
  <line x1="148" y1="200" x2="130" y2="310"
        stroke="url(#lineGrad3)" stroke-width="2.5" stroke-linecap="round"
        filter="url(#lineGlow)" opacity="0.6"/>

  <!-- === RED DOTS (sources) === -->
  <!-- Red dot 1 -->
  <circle cx="148" cy="200" r="22" fill="url(#redGrad)" filter="url(#redGlow)"/>
  <circle cx="148" cy="200" r="22" fill="none" stroke="#ffaaaa" stroke-width="3" opacity="0.8"/>
  <circle cx="148" cy="200" r="10" fill="#ff9999" opacity="0.6"/>

  <!-- Red dot 2 -->
  <circle cx="120" cy="330" r="22" fill="url(#redGrad)" filter="url(#redGlow)"/>
  <circle cx="120" cy="330" r="22" fill="none" stroke="#ffaaaa" stroke-width="3" opacity="0.8"/>
  <circle cx="120" cy="330" r="10" fill="#ff9999" opacity="0.6"/>

  <!-- Red dot 3 -->
  <circle cx="260" cy="380" r="20" fill="url(#redGrad)" filter="url(#redGlow)"/>
  <circle cx="260" cy="380" r="20" fill="none" stroke="#ffaaaa" stroke-width="2.5" opacity="0.8"/>
  <circle cx="260" cy="380" r="9" fill="#ff9999" opacity="0.6"/>

  <!-- === BLUE DOTS (targets) === -->
  <!-- Blue dot 1 -->
  <circle cx="350" cy="290" r="22" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
  <circle cx="350" cy="290" r="22" fill="none" stroke="#aaeeff" stroke-width="3" opacity="0.8"/>
  <circle cx="350" cy="290" r="10" fill="#aaddff" opacity="0.6"/>

  <!-- Blue dot 2 -->
  <circle cx="380" cy="220" r="22" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
  <circle cx="380" cy="220" r="22" fill="none" stroke="#aaeeff" stroke-width="3" opacity="0.8"/>
  <circle cx="380" cy="220" r="10" fill="#aaddff" opacity="0.6"/>

  <!-- Blue dot 3 -->
  <circle cx="400" cy="360" r="20" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
  <circle cx="400" cy="360" r="20" fill="none" stroke="#aaeeff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="400" cy="360" r="9" fill="#aaddff" opacity="0.6"/>

  <!-- Blue dot unconnected (open target) -->
  <circle cx="130" cy="310" r="20" fill="url(#blueGrad)" opacity="0.65"
          filter="url(#blueGlow)"/>
  <circle cx="130" cy="310" r="20" fill="none" stroke="#aaeeff" stroke-width="2" opacity="0.6"/>
  <!-- Dashed ring indicating "open" -->
  <circle cx="130" cy="310" r="28" fill="none" stroke="#6bd4ff"
          stroke-width="2" stroke-dasharray="6,5" opacity="0.5"/>

  <!-- Tagline -->
  <text x="256" y="474" font-family="Arial, sans-serif" font-size="15" font-weight="700"
        fill="#aad4ff" text-anchor="middle" opacity="0.7" letter-spacing="2">CONNECT THE DOTS</text>

  <!-- Bottom glow bar -->
  <rect x="130" y="460" width="252" height="4" rx="2"
        fill="url(#titleGrad)" opacity="0.5"/>
</svg>
