<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="purpleOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#e879f9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="blueOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="greenOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="orangeOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="pinkOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="tealOrb" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </radialGradient>
    <filter id="orbGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="selectedGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Ambient glow pools -->
  <circle cx="256" cy="280" r="160" fill="#a855f7" opacity="0.06"/>
  <circle cx="180" cy="320" r="80" fill="#a855f7" opacity="0.08"/>

  <!-- Selection chain line (glowing purple path connecting 3 purple orbs) -->
  <!-- Orbs at: row2col1=(118,238), row2col2=(198,238), row3col2=(198,318) -->
  <polyline points="118,238 198,238 198,318" fill="none" stroke="#e879f9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" filter="url(#orbGlow)"/>
  <polyline points="118,238 198,238 198,318" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- 4x4 orb grid (center area), spacing=80px, start x=78, y=158 -->
  <!-- Row 1: y=158 -->
  <!-- (1,1) blue -->
  <circle cx="118" cy="168" r="32" fill="url(#blueOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="108" cy="157" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (1,2) orange -->
  <circle cx="198" cy="168" r="32" fill="url(#orangeOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="188" cy="157" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (1,3) green -->
  <circle cx="278" cy="168" r="32" fill="url(#greenOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="268" cy="157" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (1,4) pink -->
  <circle cx="358" cy="168" r="32" fill="url(#pinkOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="348" cy="157" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- Row 2: y=248 -->
  <!-- (2,1) SELECTED purple - larger glow -->
  <circle cx="118" cy="248" r="36" fill="#a855f7" opacity="0.3" filter="url(#selectedGlow)"/>
  <circle cx="118" cy="248" r="32" fill="url(#purpleOrb)" filter="url(#selectedGlow)"/>
  <ellipse cx="108" cy="237" rx="10" ry="7" fill="white" opacity="0.5"/>
  <!-- Selection ring -->
  <circle cx="118" cy="248" r="37" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>

  <!-- (2,2) SELECTED purple -->
  <circle cx="198" cy="248" r="36" fill="#a855f7" opacity="0.3" filter="url(#selectedGlow)"/>
  <circle cx="198" cy="248" r="32" fill="url(#purpleOrb)" filter="url(#selectedGlow)"/>
  <ellipse cx="188" cy="237" rx="10" ry="7" fill="white" opacity="0.5"/>
  <circle cx="198" cy="248" r="37" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>

  <!-- (2,3) teal -->
  <circle cx="278" cy="248" r="32" fill="url(#tealOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="268" cy="237" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (2,4) orange -->
  <circle cx="358" cy="248" r="32" fill="url(#orangeOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="348" cy="237" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- Row 3: y=328 -->
  <!-- (3,1) green -->
  <circle cx="118" cy="328" r="32" fill="url(#greenOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="108" cy="317" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (3,2) SELECTED purple -->
  <circle cx="198" cy="328" r="36" fill="#a855f7" opacity="0.3" filter="url(#selectedGlow)"/>
  <circle cx="198" cy="328" r="32" fill="url(#purpleOrb)" filter="url(#selectedGlow)"/>
  <ellipse cx="188" cy="317" rx="10" ry="7" fill="white" opacity="0.5"/>
  <circle cx="198" cy="328" r="37" fill="none" stroke="white" stroke-width="3" opacity="0.7"/>

  <!-- (3,3) blue -->
  <circle cx="278" cy="328" r="32" fill="url(#blueOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="268" cy="317" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (3,4) pink -->
  <circle cx="358" cy="328" r="32" fill="url(#pinkOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="348" cy="317" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- Row 4: y=408 -->
  <!-- (4,1) orange -->
  <circle cx="118" cy="408" r="32" fill="url(#orangeOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="108" cy="397" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (4,2) teal -->
  <circle cx="198" cy="408" r="32" fill="url(#tealOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="188" cy="397" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (4,3) pink -->
  <circle cx="278" cy="408" r="32" fill="url(#pinkOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="268" cy="397" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- (4,4) green -->
  <circle cx="358" cy="408" r="32" fill="url(#greenOrb)" filter="url(#orbGlow)"/>
  <ellipse cx="348" cy="397" rx="10" ry="7" fill="white" opacity="0.4"/>

  <!-- Title -->
  <text x="256" y="96" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" text-anchor="middle" letter-spacing="6">LUMENO</text>
  <text x="256" y="96" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="#e879f9" text-anchor="middle" letter-spacing="6" opacity="0.4" filter="url(#titleGlow)">LUMENO</text>

  <!-- Border -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.25"/>
</svg>
