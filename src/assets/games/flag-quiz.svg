<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>
    <linearGradient id="qBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="shadowSoft">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="flag1clip">
      <rect x="0" y="0" width="200" height="130" rx="10"/>
    </clipPath>
    <clipPath id="flag2clip">
      <rect x="0" y="0" width="200" height="130" rx="10"/>
    </clipPath>
    <clipPath id="flag3clip">
      <rect x="0" y="0" width="200" height="130" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Starfield -->
  <circle cx="60" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="150" cy="40" r="1" fill="white" opacity="0.3"/>
  <circle cx="420" cy="80" r="2" fill="white" opacity="0.4"/>
  <circle cx="470" cy="150" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="30" cy="300" r="1" fill="white" opacity="0.3"/>
  <circle cx="490" cy="350" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="80" cy="450" r="1" fill="white" opacity="0.3"/>
  <circle cx="440" cy="440" r="2" fill="white" opacity="0.3"/>

  <!-- Title -->
  <text x="256" y="72" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="white" letter-spacing="5" filter="url(#shadow)">FLAG QUIZ</text>

  <!-- Flag 1 - back left (France inspired: blue/white/red vertical) -->
  <g transform="rotate(-15, 256, 280)" filter="url(#shadow)">
    <g transform="translate(86, 150)">
      <rect width="200" height="130" rx="10" fill="#003189"/>
      <rect x="66" y="0" width="68" height="130" fill="white"/>
      <rect x="133" y="0" width="67" height="130" fill="#ED2939"/>
      <rect width="200" height="130" rx="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    </g>
  </g>

  <!-- Flag 2 - back right (Brazil inspired: green/yellow/circle) -->
  <g transform="rotate(12, 256, 280)" filter="url(#shadow)">
    <g transform="translate(226, 165)">
      <rect width="200" height="130" rx="10" fill="#009C3B"/>
      <polygon points="100,10 190,65 100,120 10,65" fill="#FFDF00"/>
      <circle cx="100" cy="65" r="30" fill="#002776"/>
      <rect width="200" height="130" rx="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    </g>
  </g>

  <!-- Flag 3 - front center (Germany inspired: black/red/gold horizontal) -->
  <g transform="translate(156, 200)" filter="url(#shadow)">
    <rect width="200" height="130" rx="10" fill="#000000"/>
    <rect x="0" y="43" width="200" height="43" fill="#DD0000"/>
    <rect x="0" y="87" width="200" height="43" rx="0" fill="#FFCE00"/>
    <rect x="0" y="87" width="200" height="43" rx="0" fill="#FFCE00"/>
    <!-- bottom radius fix -->
    <rect x="0" y="110" width="200" height="20" fill="#FFCE00"/>
    <rect width="200" height="130" rx="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
  </g>

  <!-- Question mark overlay badge -->
  <circle cx="256" cy="272" r="46" fill="url(#qBadge)" filter="url(#shadow)"/>
  <circle cx="256" cy="272" r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="256" y="292" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="56" fill="white">?</text>

  <!-- Subtitle line -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="rgba(255,255,255,0.55)" letter-spacing="2">Which country is this?</text>

  <!-- Answer bubbles -->
  <rect x="56" y="398" width="180" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <text x="146" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">Germany</text>

  <rect x="276" y="398" width="180" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <text x="366" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">Belgium</text>

  <!-- Subtitle -->
  <text x="256" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.35)" letter-spacing="3">IDENTIFY THE FLAGS</text>
</svg>
