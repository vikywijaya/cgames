<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep blue/purple like other covers -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>

    <!-- Cell gradient: glossy tile -->
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4fa8"/>
      <stop offset="100%" style="stop-color:#1a357a"/>
    </linearGradient>

    <!-- Waypoint cell gradient: golden -->
    <linearGradient id="waypointGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#c07a10"/>
    </linearGradient>

    <!-- Path glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for cells -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Rounded rect clip -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="90" ry="90"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bg)"/>

  <!-- Background stars/dots -->
  <g opacity="0.3">
    <circle cx="60" cy="80" r="2" fill="white"/>
    <circle cx="440" cy="100" r="1.5" fill="white"/>
    <circle cx="80" cy="400" r="2" fill="white"/>
    <circle cx="460" cy="380" r="1.5" fill="white"/>
    <circle cx="200" cy="50" r="1" fill="white"/>
    <circle cx="350" cy="460" r="2" fill="white"/>
    <circle cx="30" cy="260" r="1.5" fill="white"/>
    <circle cx="490" cy="250" r="1" fill="white"/>
  </g>

  <!-- Title -->
  <text x="256" y="72" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="54" font-weight="900" fill="white" letter-spacing="6"
        filter="url(#shadow)">ZIP</text>
  <text x="256" y="100" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#88aaff" letter-spacing="2">CONNECT THE PATH</text>

  <!-- 4×4 grid centered, each cell 72px with 10px gap -->
  <!-- Grid starts at x=88, y=128. Cell size=72, gap=10, step=82 -->

  <!-- Row 0 -->
  <!-- Cell (0,0) waypoint 1 -->
  <rect x="88" y="128" width="72" height="72" rx="12" fill="url(#waypointGrad)" filter="url(#shadow)"/>
  <!-- Cell (1,0) normal -->
  <rect x="180" y="128" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (2,0) normal -->
  <rect x="272" y="128" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (3,0) normal -->
  <rect x="364" y="128" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>

  <!-- Row 1 -->
  <!-- Cell (0,1) normal -->
  <rect x="88" y="220" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (1,1) normal -->
  <rect x="180" y="220" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (2,1) waypoint 2 -->
  <rect x="272" y="220" width="72" height="72" rx="12" fill="url(#waypointGrad)" filter="url(#shadow)"/>
  <!-- Cell (3,1) normal -->
  <rect x="364" y="220" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>

  <!-- Row 2 -->
  <!-- Cell (0,2) normal -->
  <rect x="88" y="312" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (1,2) waypoint 3 -->
  <rect x="180" y="312" width="72" height="72" rx="12" fill="url(#waypointGrad)" filter="url(#shadow)"/>
  <!-- Cell (2,2) normal -->
  <rect x="272" y="312" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (3,2) normal -->
  <rect x="364" y="312" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>

  <!-- Row 3 -->
  <!-- Cell (0,3) normal -->
  <rect x="88" y="404" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (1,3) normal -->
  <rect x="180" y="404" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (2,3) normal -->
  <rect x="272" y="404" width="72" height="72" rx="12" fill="url(#cellGrad)" filter="url(#shadow)"/>
  <!-- Cell (3,3) waypoint 4 -->
  <rect x="364" y="404" width="72" height="72" rx="12" fill="url(#waypointGrad)" filter="url(#shadow)"/>

  <!-- PATH: snake through all 16 cells in order:
       (0,0)→(1,0)→(2,0)→(3,0)→(3,1)→(2,1)→(1,1)→(0,1)→(0,2)→(1,2)→(2,2)→(3,2)→(3,3)→(2,3)→(1,3)→(0,3)
       Center of each cell: x = 88+36=124, step=92; y = 128+36=164, step=92
       cell centers: col0=124, col1=216, col2=308, col3=400
                     row0=164, row1=256, row2=348, row3=440
  -->
  <polyline
    points="124,164 216,164 308,164 400,164
            400,256 308,256 216,256 124,256
            124,348 216,348 308,348 400,348
            400,440 308,440 216,440 124,440"
    fill="none"
    stroke="#00e5ff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
    filter="url(#glow)"
  />

  <!-- Waypoint number labels -->
  <!-- 1 at (0,0) center 124,164 -->
  <circle cx="124" cy="164" r="22" fill="#1a1a4e" opacity="0.6"/>
  <text x="124" y="172" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="26" font-weight="900" fill="white">1</text>

  <!-- 2 at (2,1) center 308,256 -->
  <circle cx="308" cy="256" r="22" fill="#1a1a4e" opacity="0.6"/>
  <text x="308" y="264" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="26" font-weight="900" fill="white">2</text>

  <!-- 3 at (1,2) center 216,348 -->
  <circle cx="216" cy="348" r="22" fill="#1a1a4e" opacity="0.6"/>
  <text x="216" y="356" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="26" font-weight="900" fill="white">3</text>

  <!-- 4 at (3,3) center 400,440 -->
  <circle cx="400" cy="440" r="22" fill="#1a1a4e" opacity="0.6"/>
  <text x="400" y="448" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="26" font-weight="900" fill="white">4</text>

  <!-- Glossy overlay on background -->
  <ellipse cx="256" cy="100" rx="200" ry="80" fill="white" opacity="0.04"/>
</svg>
