<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaritaHub — 飞行棋 Ludo</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* ── Ludo page styles ── */
    #ludoApp { position: relative; }

    /* Players strip */
    .ludo-players {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: center; margin-bottom: 12px;
    }
    .ludo-player {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px;
      background: #f5f5f5; font-size: 16px; font-weight: 600;
    }
    .ludo-player.active { outline: 3px solid var(--blue); background: var(--blue-light); }
    .ludo-player-dot {
      width: 18px; height: 18px; border-radius: 50%;
    }
    .ludo-player-dot.c-red { background: #D32F2F; }
    .ludo-player-dot.c-blue { background: #1565C0; }
    .ludo-player-dot.c-green { background: #2E7D32; }
    .ludo-player-dot.c-yellow { background: #F9A825; }

    /* Dice area */
    .ludo-dice-area {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; margin-bottom: 12px;
    }
    .ludo-dice {
      width: 80px; height: 80px; background: #fff;
      border: 3px solid #333; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 800;
      transition: transform 0.3s;
    }
    .ludo-dice.rolling {
      animation: diceShake 0.4s ease-in-out;
    }
    @keyframes diceShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-15deg) scale(1.1); }
      50% { transform: rotate(10deg) scale(1.05); }
      75% { transform: rotate(-5deg) scale(1.02); }
    }
    .ludo-roll-btn {
      padding: 16px 32px; font-size: 20px; font-weight: 700;
      background: var(--blue); color: #fff; border: none;
      border-radius: 12px; cursor: pointer; min-height: 56px;
    }
    .ludo-roll-btn:disabled {
      background: #ccc; color: #888; cursor: not-allowed;
    }
    .ludo-roll-btn:active:not(:disabled) { transform: scale(0.97); }

    /* Status text */
    .ludo-status {
      text-align: center; font-size: 18px; font-weight: 600;
      color: var(--text-muted); min-height: 28px; margin-bottom: 8px;
    }

    /* Canvas board */
    .ludo-board-wrap {
      display: flex; justify-content: center; margin-bottom: 12px;
    }
    #ludoCanvas {
      max-width: 100%; height: auto;
      border-radius: 8px; touch-action: none;
    }

    /* Game over overlay */
    .ludo-gameover {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.65);
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
    }
    .ludo-gameover.visible { display: flex; }
    .ludo-gameover-box {
      background: #fff; border-radius: 16px; padding: 32px 40px;
      text-align: center; max-width: 380px;
    }
    .ludo-gameover-box h2 { font-size: 28px; margin-bottom: 8px; }
    .ludo-gameover-box p { font-size: 20px; color: var(--text-muted); margin-bottom: 16px; }
    .ludo-gameover-box button {
      padding: 14px 28px; font-size: 18px; font-weight: 700;
      background: var(--blue); color: #fff; border: none;
      border-radius: 10px; cursor: pointer;
    }

    /* Reconnect overlay */
    .ludo-reconnect {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center;
      color: #fff; font-size: 22px;
    }
    .ludo-reconnect.visible { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-inner">
        <div class="header-nav"><a href="/" class="back-link">← All Games</a></div>
        <h1>飞行棋 Ludo</h1>
        <p class="subtitle" id="statusBar">Connecting…</p>
      </div>
    </header>

    <main id="ludoApp">

      <!-- Waiting overlay -->
      <div id="waitingOverlay" class="overlay-card">
        <p id="waitingMsg">Waiting for game to start…</p>
      </div>

      <!-- Game UI (hidden until started) -->
      <div id="gameUI" class="hidden">

        <!-- Players strip -->
        <div id="ludoPlayers" class="ludo-players"></div>

        <!-- Status -->
        <div id="ludoStatus" class="ludo-status"></div>

        <!-- Dice area -->
        <div class="ludo-dice-area">
          <div id="ludoDice" class="ludo-dice">-</div>
          <button id="rollBtn" class="ludo-roll-btn" disabled>Roll Dice</button>
        </div>

        <!-- Board -->
        <div class="ludo-board-wrap">
          <canvas id="ludoCanvas" width="600" height="600"></canvas>
        </div>

      </div>

      <!-- Game over -->
      <div id="gameoverOverlay" class="ludo-gameover">
        <div class="ludo-gameover-box">
          <h2 id="gameoverTitle">Game Over!</h2>
          <p id="gameoverMsg"></p>
          <button id="playAgainBtn">Back to Lobby</button>
        </div>
      </div>

      <!-- Reconnect -->
      <div id="reconnectOverlay" class="ludo-reconnect">
        Reconnecting…
      </div>

    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/ludo-game.js"></script>
  <script src="/js/dev-test.js"></script>
</body>
</html>
