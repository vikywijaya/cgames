<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pattern Sequence</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    /* ── Playing ── */
    .playing-screen { justify-content: flex-start; padding: 0; gap: 0; }

    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .top-label { font-size: 12px; color: #f59e0b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .top-value { font-size: 22px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }

    .status-msg { width: 100%; text-align: center; font-size: 18px; font-weight: 700; height: 44px; line-height: 44px; flex-shrink: 0; transition: color 200ms ease; }
    .status-msg.watch { color: #fbbf24; animation: pulse-text 1.2s ease-in-out infinite; }
    .status-msg.input { color: #4ade80; }
    .status-msg.failed { color: #ef4444; }
    .status-msg.finished { color: #60a5fa; }
    @keyframes pulse-text { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* Progress dots */
    .dots-row { display: flex; gap: 6px; justify-content: center; padding: 4px 16px; flex-wrap: wrap; height: 28px; flex-shrink: 0; align-items: center; }
    .pdot { width: 14px; height: 14px; border-radius: 50%; background: #334155; transition: background 200ms ease, transform 200ms ease; flex-shrink: 0; }
    .pdot.correct { background: #4ade80; transform: scale(1.1); }
    .pdot.wrong { background: #ef4444; animation: dotShake 300ms ease; }
    .pdot.current { background: #fbbf24; animation: dotPulse 0.8s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
    @keyframes dotShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

    /* Pad buttons — 2x2 grid */
    .pads-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px; }
    .pads-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 14px; width: 100%; max-width: 340px; aspect-ratio: 1; }
    .pad-btn { border: 3px solid transparent; border-radius: 22px; font-size: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 120ms var(--ease-out), opacity 120ms var(--ease-out), box-shadow 120ms ease, border-color 120ms ease; touch-action: manipulation; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .pad-btn:active:not(:disabled) { transform: scale(0.92); }
    .pad-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .pad-btn.flash { transform: scale(1.06); border-color: rgba(255,255,255,0.5); box-shadow: 0 0 24px rgba(255,255,255,0.25); }
    .pad-red    { background: linear-gradient(135deg, #ef4444, #dc2626); border-color: rgba(239,68,68,0.3); }
    .pad-blue   { background: linear-gradient(135deg, #3b82f6, #2563eb); border-color: rgba(59,130,246,0.3); }
    .pad-yellow { background: linear-gradient(135deg, #eab308, #ca8a04); border-color: rgba(234,179,8,0.3); }
    .pad-green  { background: linear-gradient(135deg, #22c55e, #16a34a); border-color: rgba(34,197,94,0.3); }

    /* Ready countdown overlay */
    .mobile-ready-overlay {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(10,10,10,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      backdrop-filter: blur(8px);
    }
    .mobile-ready-overlay.hidden { display: none !important; }
    .mobile-ready-number {
      font-size: 100px; font-weight: 900; color: #fbbf24;
      text-shadow: 0 0 40px rgba(251,191,36,0.4);
      animation: mReadyPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .mobile-ready-text {
      font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.6);
      letter-spacing: 3px; text-transform: uppercase;
    }
    @keyframes mReadyPop { 0% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* Gameover */
    .gameover-screen { background: radial-gradient(ellipse at center, #1e3a1e 0%, #1a1a2e 70%); }
    .go-trophy   { font-size: 80px; animation: pop 500ms cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .go-title    { font-size: 38px; font-weight: 900; color: #fbbf24; }
    .go-score    { font-size: 48px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .go-personal { font-size: 20px; color: #94a3b8; text-align: center; line-height: 1.5; }
    .play-again  { padding: 18px 44px; font-size: 20px; font-weight: 800; border: 2px solid #f59e0b; border-radius: 14px; background: transparent; color: #fbbf24; cursor: pointer; margin-top: 12px; transition: transform 150ms var(--ease-out); min-height: 56px; }
    .play-again:active { transform: scale(0.96); background-color: rgba(245,158,11,0.1); }

    /* Reconnect */
    .reconnect { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; flex-direction: column; font-size: 20px; color: #fff; z-index: 99; gap: 12px; }
    .reconnect.show { display: flex; }
    .reconnect-spin { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .waiting-anim { animation: none; }
      .reconnect-spin { animation-duration: 3s; }
      .pad-btn, .join-btn, .play-again { transition-property: background-color; transition-duration: 120ms; }
      .go-trophy { animation: fadeOnly 200ms ease; }
      @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
<!-- Join -->
<div id="joinScreen" class="screen active">
  <div class="join-logo">🎵</div>
  <div class="join-title">Pattern Sequence</div>
  <div class="join-sub">Watch the pattern on the TV, then repeat it on your phone!</div>
  <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
  <button id="joinBtn" class="join-btn">Join Game</button>
  <div id="joinError" class="error-msg" role="alert" aria-live="polite"></div>
</div>

<!-- Waiting -->
<div id="waitingScreen" class="screen">
  <div class="waiting-anim">🎵</div>
  <div class="waiting-title">You're in!</div>
  <div class="waiting-name" id="waitingName"></div>
  <div class="waiting-sub">Waiting for the host to start...</div>
</div>

<!-- Playing -->
<div id="playingScreen" class="screen playing-screen" style="position:relative;">
  <div class="top-bar">
    <div>
      <div class="top-label">Score</div>
      <div class="top-value" id="myScore">0 pts</div>
    </div>
    <div style="text-align:center">
      <div class="top-label">Sequence</div>
      <div class="top-value" id="seqInfo">0/0</div>
    </div>
    <div style="text-align:right">
      <div class="top-label">Round</div>
      <div class="top-value" id="roundInfo">1/3</div>
    </div>
  </div>

  <div id="statusMsg" class="status-msg watch">Watch the TV!</div>
  <div id="dotsRow" class="dots-row"></div>

  <div class="pads-area">
    <div class="pads-grid">
      <button class="pad-btn pad-red"    id="padBtn0" data-pad="0" aria-label="Red pad"    disabled></button>
      <button class="pad-btn pad-blue"   id="padBtn1" data-pad="1" aria-label="Blue pad"   disabled></button>
      <button class="pad-btn pad-yellow" id="padBtn2" data-pad="2" aria-label="Yellow pad" disabled></button>
      <button class="pad-btn pad-green"  id="padBtn3" data-pad="3" aria-label="Green pad"  disabled></button>
    </div>
  </div>

  <!-- Ready countdown overlay -->
  <div id="mobileReadyOverlay" class="mobile-ready-overlay hidden">
    <div class="mobile-ready-number" id="mobileReadyNumber">5</div>
    <div class="mobile-ready-text">Get Ready!</div>
  </div>
</div>

<!-- Game Over -->
<div id="gameoverScreen" class="screen gameover-screen">
  <div id="goTrophy" class="go-trophy">🎵</div>
  <div id="goTitle"  class="go-title">Game Over!</div>
  <div id="goScore"  class="go-score"></div>
  <div id="goPersonal" class="go-personal"></div>
</div>

<div id="reconnectOverlay" class="reconnect">
  <div class="reconnect-spin">🔄</div>
  <div>Reconnecting...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/sfx.js"></script>
<script src="/js/pattern-sequence-play.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
