<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Quick Maths ⚡</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    :root {
      --bg:          #141414;
      --surface:     rgba(255,255,255,0.07);
      --border:      rgba(255,255,255,0.12);
      --text:        #FFFFFF;
      --text-muted:  rgba(255,255,255,0.55);
      --primary:     #3D72E8;
      --primary-dim: rgba(61,114,232,0.18);
      --success:     #2DAF7B;
      --success-bg:  rgba(45,175,123,0.15);
      --danger:      #E84B3D;
      --danger-bg:   rgba(232,75,61,0.15);
      --accent:      #E07820;
      --gold:        #f59e0b;
      --radius-md:   10px;
      --radius-lg:   14px;
      --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ── Playing ── */
    .playing-screen { justify-content: flex-start; padding: 0; gap: 0; }

    .progress-bar-wrap { width: 100%; height: 6px; background: var(--surface); flex-shrink: 0; }
    .progress-bar { height: 100%; background: var(--primary); transition: width 0.3s; }

    .score-banner {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .score-label { font-size: 12px; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 24px; font-weight: 900; }
    .round-label { font-size: 12px; color: var(--text-muted); text-align: right; }

    .question-area {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; gap: 6px; width: 100%;
    }
    .question-prompt   { font-size: 13px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
    .question-equation {
      font-size: 52px; font-weight: 900; color: var(--text); text-align: center;
      letter-spacing: 4px; line-height: 1.1;
    }

    .options-area { width: 100%; padding: 0 16px 20px; flex-shrink: 0; }
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }

    .option-btn {
      padding: 0; height: 78px;
      font-size: 30px; font-weight: 900; font-family: inherit;
      border: 2px solid var(--border); border-radius: var(--radius-lg);
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: transform 100ms var(--ease-out), background 150ms, border-color 150ms, box-shadow 150ms;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .option-btn:active:not(:disabled) { transform: scale(0.93); }
    .option-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .option-btn.opt-correct {
      background: var(--success-bg); border-color: var(--success);
      color: var(--success); box-shadow: 0 0 18px rgba(45,175,123,0.3);
    }
    .option-btn.opt-wrong {
      background: var(--danger-bg); border-color: var(--danger); color: var(--danger);
    }
    .option-btn.opt-reveal-correct {
      background: var(--success-bg); border-color: var(--success);
    }

    /* Feedback */
    .feedback-msg {
      text-align: center; font-size: 20px; font-weight: 800;
      height: 32px; line-height: 32px;
      padding: 0 16px; letter-spacing: 0.5px; flex-shrink: 0;
    }
    .feedback-msg:empty { visibility: hidden; }

    /* Between-round overlay */
    .watch-tv-msg {
      position: absolute; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 10;
    }
    .watch-tv-emoji { font-size: 72px; animation: floatUp 1.4s ease-in-out infinite; }
    .watch-tv-text  { font-size: 24px; font-weight: 800; color: var(--text); text-align: center; }
    .watch-tv-score { font-size: 18px; color: var(--text-muted); text-align: center; margin-top: 4px; }
    .watch-tv-msg.hidden { display: none !important; }

    /* Gameover */
    .gameover-screen { background: radial-gradient(ellipse at center, rgba(61,114,232,0.15) 0%, var(--bg) 70%); }
    .gameover-trophy  { font-size: 80px; animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }
    .gameover-title    { font-size: 36px; font-weight: 900; color: var(--gold); }
    .gameover-personal { font-size: 20px; color: var(--text-muted); text-align: center; margin-top: 4px; }
    .gameover-score    { font-size: 52px; font-weight: 900; }
    .gameover-msg      { font-size: 15px; color: var(--primary); text-align: center; }

    .play-again-btn {
      margin-top: 20px; padding: 16px 40px; font-size: 20px; font-weight: 800; font-family: inherit;
      border: 2px solid var(--primary); border-radius: var(--radius-lg);
      background: var(--primary-dim); color: var(--primary); cursor: pointer;
      transition: background 150ms, transform 100ms var(--ease-out);
      touch-action: manipulation;
    }
    .play-again-btn:active { transform: scale(0.97); background: var(--primary); color: #fff; }

    /* Reconnect */
    .reconnect-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      align-items: center; justify-content: center; flex-direction: column;
      font-size: 20px; color: var(--text); z-index: 99; text-align: center; padding: 20px; gap: 12px;
    }
    .reconnect-overlay.show { display: flex; }
    .reconnect-spinner { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <!-- Join -->
  <div id="joinScreen" class="screen active">
    <div class="join-logo">⚡</div>
    <div class="join-title">Quick Maths</div>
    <div class="join-sub">Fastest finger wins — tap the right answer!</div>
    <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button id="joinBtn" class="join-btn">Join Game</button>
    <div id="joinError" class="error-msg"></div>
  </div>

  <!-- Waiting -->
  <div id="waitingScreen" class="screen">
    <div class="waiting-emoji">⚡</div>
    <div class="waiting-title">You're in!</div>
    <div class="waiting-name" id="waitingName"></div>
    <div class="waiting-sub">Waiting for the host to start the game…</div>
  </div>

  <!-- Playing -->
  <div id="playingScreen" class="screen playing-screen" style="position:relative;">

    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>

    <div class="score-banner">
      <div>
        <div class="score-label">Score</div>
        <div class="score-value" id="myScoreDisplay">0 pts</div>
      </div>
      <div style="text-align:right">
        <div class="score-label">Question</div>
        <div id="questionInfo" class="score-value" style="font-size:18px">—</div>
      </div>
    </div>

    <div class="question-area">
      <div class="question-prompt">Solve it fast!</div>
      <div id="questionDisplay" class="question-equation">?</div>
    </div>

    <div id="feedbackMsg" class="feedback-msg"></div>

    <div class="options-area">
      <div class="options-grid">
        <button class="option-btn" data-idx="0"></button>
        <button class="option-btn" data-idx="1"></button>
        <button class="option-btn" data-idx="2"></button>
        <button class="option-btn" data-idx="3"></button>
      </div>
    </div>

    <!-- Between-round overlay -->
    <div id="watchTvMsg" class="watch-tv-msg hidden">
      <div class="watch-tv-emoji">📺</div>
      <div class="watch-tv-text" id="watchTvText">Watch the TV screen!</div>
      <div class="watch-tv-score" id="watchTvScore"></div>
    </div>

  </div>

  <!-- Game Over -->
  <div id="gameoverScreen" class="screen gameover-screen">
    <div id="gameoverTrophy" class="gameover-trophy">🏆</div>
    <div id="gameoverTitle" class="gameover-title">Game Over!</div>
    <div id="gameoverScore" class="gameover-score"></div>
    <div id="gameoverPersonal" class="gameover-personal"></div>
    <div id="gameoverMsg" class="gameover-msg"></div>
  </div>

  <div id="reconnectOverlay" class="reconnect-overlay">
    <div class="reconnect-spinner">🔄</div>
    <div>Reconnecting…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sfx.js"></script>
  <script src="/js/quick-maths-play.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
