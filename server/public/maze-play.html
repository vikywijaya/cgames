<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>Maze Runner</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    /* ── Playing Screen ── */
    .playing-screen {
      background: #0a0e17;
      color: #fff;
      padding: 8px;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    /* Mini-map */
    .minimap-section {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 4px 0;
    }

    .minimap-canvas {
      border: 2px solid #4ecca3;
      border-radius: 8px;
      background: #111;
    }

    /* Heading indicator */
    .heading-label {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #4ecca3;
      letter-spacing: 0.05em;
    }

    /* First-person view */
    .fpv-section {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    .fpv-canvas {
      border: 2px solid #333;
      border-radius: 12px;
      background: #0a0e17;
      max-width: 100%;
      max-height: 100%;
    }

    /* Controls */
    .controls-section {
      width: 100%;
      max-width: 320px;
      padding: 4px 0 12px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 8px;
      justify-items: center;
    }

    .ctrl-btn {
      width: 80px;
      min-height: 64px;
      font-size: 28px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #fff;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.08s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .ctrl-btn.forward {
      grid-column: 2;
      grid-row: 1;
      background: #2a7a5a;
    }
    .ctrl-btn.forward:active:not(:disabled) { background: #3aaa7a; }

    .ctrl-btn.turn-left {
      grid-column: 1;
      grid-row: 2;
      background: #2a5a8a;
    }
    .ctrl-btn.turn-left:active:not(:disabled) { background: #3a7aba; }

    .ctrl-btn.turn-right {
      grid-column: 3;
      grid-row: 2;
      background: #2a5a8a;
    }
    .ctrl-btn.turn-right:active:not(:disabled) { background: #3a7aba; }

    .ctrl-btn.back {
      grid-column: 2;
      grid-row: 3;
      background: #5a3a2a;
    }
    .ctrl-btn.back:active:not(:disabled) { background: #8a5a3a; }

    /* Center spacer in the controls grid */
    .ctrl-spacer {
      grid-column: 2;
      grid-row: 2;
    }

    /* Move feedback */
    .move-feedback {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      min-height: 22px;
      color: #ff6b6b;
      transition: opacity 0.3s;
    }

    /* ── Game Over Screen ── */
    .gameover-screen {
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 16px;
      background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
      color: #fff;
    }

    .gameover-emoji { font-size: 80px; }

    .gameover-title {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
    }

    .gameover-msg {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      max-width: 350px;
    }

    .gameover-personal {
      font-size: 28px;
      font-weight: 800;
      color: #4ecca3;
      text-align: center;
    }

    /* ── Reconnect ── */
    .reconnect-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      z-index: 100;
    }

    /* ── Confetti ── */
    .confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0;
      animation: confettiFall 3s ease-in forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; top: -10px; transform: rotate(0deg) scale(1); }
      100% { opacity: 0; top: 110vh; transform: rotate(720deg) scale(0.5); }
    }

  </style>
</head>
<body>
<!-- ── Join Screen ── -->
  <div id="joinScreen" class="screen join-screen active">
    <div class="join-logo">🌀</div>
    <div class="join-title">Maze Runner</div>
    <div class="join-subtitle">Navigate the maze faster than everyone!</div>
    <input id="nameInput" class="join-input" type="text" placeholder="Your Name" maxlength="30" autocomplete="off" />
    <button id="joinBtn" class="join-btn">Join Game</button>
    <div id="joinError" class="join-error"></div>
  </div>

  <!-- ── Waiting Screen ── -->
  <div id="waitingScreen" class="screen waiting-screen">
    <div class="waiting-title">Waiting for host to start...</div>
    <div class="waiting-dots">...</div>
    <div id="waitingName" class="waiting-name"></div>
    <div class="waiting-players">
      <div class="waiting-players-title">Players in game:</div>
      <div id="waitingPlayerList"></div>
    </div>
  </div>

  <!-- ── Playing Screen ── -->
  <div id="playingScreen" class="screen playing-screen">

    <!-- Mini-map (3x3 nearby cells) -->
    <div class="minimap-section">
      <canvas id="minimapCanvas" class="minimap-canvas" width="120" height="120"></canvas>
    </div>

    <!-- Heading indicator -->
    <div id="headingLabel" class="heading-label">Facing: North</div>

    <!-- First-person 3D corridor view -->
    <div class="fpv-section">
      <canvas id="fpvCanvas" class="fpv-canvas" width="320" height="240"></canvas>
    </div>

    <!-- Move feedback -->
    <div id="moveFeedback" class="move-feedback"></div>

    <!-- Movement controls (cross layout) -->
    <div class="controls-section">
      <div class="controls-grid">
        <button id="btnForward" class="ctrl-btn forward" aria-label="Move Forward">&#x2191;</button>
        <button id="btnTurnLeft" class="ctrl-btn turn-left" aria-label="Turn Left">&#x21BA;</button>
        <div class="ctrl-spacer"></div>
        <button id="btnTurnRight" class="ctrl-btn turn-right" aria-label="Turn Right">&#x21BB;</button>
        <button id="btnBack" class="ctrl-btn back" aria-label="Move Back">&#x2193;</button>
      </div>
    </div>

  </div>

  <!-- ── Game Over Screen ── -->
  <div id="gameoverScreen" class="screen gameover-screen">
    <div id="gameoverEmoji" class="gameover-emoji"></div>
    <div id="gameoverTitle" class="gameover-title">Game Over</div>
    <div id="gameoverPersonal" class="gameover-personal"></div>
    <div id="gameoverMsg" class="gameover-msg"></div>
  </div>

  <!-- ── Confetti Container ── -->
  <div id="confettiContainer" class="confetti-container hidden"></div>

  <!-- ── Reconnect Overlay ── -->
  <div id="reconnectOverlay" class="reconnect-overlay hidden">
    Connection lost. Reconnecting...
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/maze-play.js"></script>
  <script src="/js/dev-test.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
