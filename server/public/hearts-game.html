<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearts</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="heartsApp">

    <!-- Player info row -->
    <div class="cdi-players" id="heartsPlayers"></div>

    <!-- Status bar -->
    <div id="statusBar">Loading game…</div>

    <!-- Current trick -->
    <div id="heartsTable">
      <span id="heartsTableLabel">Current Trick</span>
      <div id="trickCards"></div>
      <span id="trickInfo" class="combo-type-badge hidden"></span>
    </div>

    <!-- Score summary -->
    <div id="scoreBar" class="hidden">
      <span id="scoreText"></span>
    </div>

    <!-- My hand label -->
    <p class="hand-label">Your Hand</p>

    <!-- My hand -->
    <div id="myHand"></div>

    <!-- Actions -->
    <div class="cdi-actions">
      <button id="playBtn" class="btn btn-primary" disabled>Play Selected</button>
    </div>

  </div>

  <!-- Game over overlay -->
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2 id="gameOverTitle">Game Over</h2>
      <p  id="gameOverMsg"></p>
      <div class="overlay-btns">
        <button id="playAgainBtn" class="btn btn-success">Play Again</button>
        <button id="backLobbyBtn" class="btn btn-primary">Back to Lobby</button>
      </div>
    </div>
  </div>

  <!-- Reconnecting overlay -->
  <div id="reconnectOverlay" class="overlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <h2>Reconnecting…</h2>
      <p id="reconnectMsg">Please wait.</p>
      <a id="backLobbyLink" href="/" class="btn btn-secondary hidden">Back to Lobby</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/hearts-game.js"></script>
  <script src="/js/dev-test.js"></script>
</body>
</html>
