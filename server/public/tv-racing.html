<!-- ── Lobby Phase ── -->
  <div id="lobbyPhase" class="tv-phase tv-lobby active">
    <div class="tv-lobby-titlebar"><img class="tv-lobby-icon" src="/img/banner-tv-racing.jpg" alt="" /><div class="tv-lobby-title">🏎️ RC Racing</div></div>
    <div class="tv-lobby-subtitle">Scan the QR code to join the race!</div>
    <div class="tv-lobby-body">
      <div class="tv-qr-section">
        <div class="tv-qr-box">
          <div id="qrcode"></div>
        </div>
        <div class="tv-qr-instruction">Scan with your phone camera</div>
        <div id="joinUrl" class="tv-qr-url"></div>
        <a href="/tv.html" class="tv-back-btn">Back to Games</a>
      </div>
      <div class="tv-player-section">
        <dotlottie-player class="tv-qr-lottie" src="/lottie/qr-animation.lottie" background="transparent" speed="1" loop autoplay></dotlottie-player>
        <div class="tv-player-section-title">Racers Joined</div>
        <div id="lobbyPlayerList" class="tv-player-list">
          <div class="tv-player-empty">Waiting for racers...</div>
        </div>
        <button id="startBtn" class="tv-start-btn" disabled>Start Race</button>
      </div>
    </div>
  </div>

  <!-- ── Racing Phase (includes countdown overlay) ── -->
  <div id="racingPhase" class="tv-phase race-playing">
    <div class="tv-playing-header" style="position:absolute;top:0;left:0;right:0;z-index:10;background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(255,255,255,0.08);">
      <a href="/tv.html" class="tv-nav-back" onclick="return confirm("Leave this game?");">Back</a>
      <div class="tv-playing-title" style="-webkit-text-fill-color:unset;background:none;color:#fff;">RC Racing</div>
      <div id="lapInfo" class="tv-playing-meta"></div>
    </div>
    <canvas id="raceCanvas"></canvas>
    <div id="leaderboard" class="race-leaderboard"></div>

    <!-- Countdown overlay (sits on top of canvas) -->
    <div id="countdownOverlay" class="countdown-overlay hidden">
      <div id="countdownNumber" class="countdown-number">3</div>
    </div>
  </div>

  <!-- ── Game Over Phase ── -->
  <div id="gameOverPhase" class="tv-phase tv-gameover">
    <div class="tv-gameover-emoji">🏆</div>
    <div id="winnerTitle" class="tv-gameover-title">Race Complete!</div>
    <div id="winnerName" class="tv-gameover-winner-name"></div>
    <div id="resultsTable" class="tv-gameover-scores"></div>
    <div class="tv-gameover-btns">
      <button id="playAgainBtn" class="tv-btn-play-again">Play Again</button>
    </div>
  </div>
