<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ring Sort 💍</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    /* Playing */
    .playing-screen { justify-content: flex-start; padding: 0; gap: 0; position: relative; }

    .score-banner { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #150d2e; border-bottom: 1px solid #2d1b5e; }
    .score-label { font-size: 12px; color: #a855f7; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .score-value { font-size: 22px; font-weight: 900; color: #fff; }

    .feedback-bar { width: 100%; padding: 8px 16px; text-align: center; font-size: 18px; font-weight: 700; min-height: 36px; }

    /* Ring sort play area */
    .rods-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 8px 12px; overflow: hidden; }
    .rods-row { display: flex; gap: 12px; align-items: flex-end; justify-content: center; }

    .rod-btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; border: none; background: transparent; padding: 6px 4px 0; border-radius: 12px; border: 2px solid transparent; transition: border-color 0.15s, transform 0.08s; touch-action: manipulation; }
    .rod-btn:active:not(:disabled) { transform: scale(0.95); }
    .rod-btn.selected { border-color: #818cf8; }
    .rod-btn.complete  { border-color: #4ade80; }
    .rod-btn.shaking   { animation: shake 0.3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .rod-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .rod-peg-wrap { position: relative; display: flex; align-items: flex-end; justify-content: center; }
    .rod-peg { width: 6px; border-radius: 3px; background: #475569; }
    .rod-rings-col { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; padding-bottom: 4px; }
    .ring-item { height: 14px; border-radius: 7px; transition: transform 0.1s; }
    .ring-item.lifted { transform: translateY(-12px); }
    .rod-base { height: 8px; border-radius: 4px; background: #64748b; width: 100%; margin-top: 2px; }
    .rod-btn.complete .rod-base { background: #4ade80; }
    .rod-btn.complete .rod-peg { background: #4ade80; }

    /* Instructions */
    .rod-hint { font-size: 12px; color: #64748b; margin-top: 4px; }

    /* Watch TV overlay */
    .watch-tv { position: absolute; inset: 0; background: #0f0f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; }
    .watch-tv.hidden { display: none !important; }
    .watch-tv-emoji { font-size: 64px; animation: bounce 1.2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .watch-tv-text { font-size: 24px; font-weight: 800; color: #c084fc; text-align: center; }
    .watch-tv-sub { font-size: 16px; color: #64748b; text-align: center; }

    /* Gameover */
    .gameover-screen { background: radial-gradient(ellipse at center, #2d1b5e 0%, #0f0f1a 70%); }
    .gameover-trophy { font-size: 80px; animation: pop 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
    .gameover-title { font-size: 38px; font-weight: 900; color: #c084fc; }
    .gameover-score { font-size: 48px; font-weight: 900; color: #fff; margin: 8px 0; }
    .gameover-personal { font-size: 22px; color: #94a3b8; text-align: center; }
    .play-again-btn { padding: 16px 40px; font-size: 20px; font-weight: 800; border: 2px solid #a855f7; border-radius: 14px; background: transparent; color: #c084fc; cursor: pointer; margin-top: 12px; }

    .reconnect-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; flex-direction: column; font-size: 20px; color: #fff; z-index: 99; text-align: center; padding: 20px; gap: 12px; }
    .reconnect-overlay.show { display: flex; }
    .reconnect-spinner { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<!-- Join -->
  <div id="joinScreen" class="screen active">
    <div class="join-logo">💍</div>
    <div class="join-title">Ring Sort</div>
    <div class="join-sub">Sort all rings by colour — first to finish wins!</div>
    <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button id="joinBtn" class="join-btn">Join Game</button>
    <div id="joinError" class="error-msg"></div>
  </div>

  <!-- Waiting -->
  <div id="waitingScreen" class="screen">
    <div class="waiting-anim">💍</div>
    <div class="waiting-title">You're in!</div>
    <div class="waiting-name" id="waitingName"></div>
    <div class="waiting-sub">Waiting for the host to start the game…</div>
  </div>

  <!-- Playing -->
  <div id="playingScreen" class="screen playing-screen">
    <div class="score-banner">
      <div>
        <div class="score-label">Your Score</div>
        <div class="score-value" id="myScoreDisplay">0 pts</div>
      </div>
      <div style="text-align:right">
        <div class="score-label">Round</div>
        <div id="roundInfo" class="score-value" style="font-size:18px;">—</div>
      </div>
    </div>

    <div id="feedbackBar" class="feedback-bar"></div>

    <div class="rods-area">
      <div id="rodsRow" class="rods-row"></div>
    </div>

    <div id="watchTv" class="watch-tv hidden">
      <div class="watch-tv-emoji">💍</div>
      <div class="watch-tv-text" id="watchTvText">Nice work!</div>
      <div class="watch-tv-sub" id="watchTvSub"></div>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameoverScreen" class="screen gameover-screen">
    <div id="gameoverTrophy" class="gameover-trophy">💍</div>
    <div id="gameoverTitle" class="gameover-title">Game Over!</div>
    <div id="gameoverScore" class="gameover-score"></div>
    <div id="gameoverPersonal" class="gameover-personal"></div>
  </div>

  <div id="reconnectOverlay" class="reconnect-overlay">
    <div class="reconnect-spinner">🔄</div>
    <div>Reconnecting…</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/sfx.js"></script>
  <script src="/js/ring-sort-play.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
