<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Speed Tap</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --bg: #1a1a2e;
      --surface: #0f172a;
      --border: #334155;
      --green: #4ade80;
      --red: #f87171;
    }

    /* ── Playing ── */
    .playing-screen { justify-content: flex-start; padding: 0; gap: 0; }

    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .top-label { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .top-value { font-size: 22px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }

    /* Target display */
    .target-bar {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 20px; background: rgba(245,158,11,0.1); border-bottom: 2px solid var(--accent);
      flex-shrink: 0;
    }
    .target-label { font-size: 20px; font-weight: 800; color: var(--accent-light); }
    .target-emoji { font-size: 40px; }

    /* Emoji grid */
    .grid-area { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden; padding: 16px; }
    .emoji-grid { display: grid; gap: 10px; }

    .emoji-btn {
      display: flex; align-items: center; justify-content: center;
      border: 3px solid var(--border); border-radius: 14px;
      background: var(--surface); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 100ms var(--ease-out), border-color 150ms, background 150ms;
      min-width: 64px; min-height: 64px;
    }
    .emoji-btn:active:not(.tapped) { transform: scale(0.92); }
    .emoji-btn.tapped { pointer-events: none; opacity: 0.6; }
    .emoji-btn.correct { border-color: var(--green); background: rgba(74,222,128,0.2); animation: flashGreen 400ms var(--ease-out); }
    .emoji-btn.wrong { border-color: var(--red); background: rgba(248,113,113,0.15); animation: flashRed 400ms var(--ease-out); }
    .emoji-btn.timeout { opacity: 0.35; pointer-events: none; }
    .emoji-btn.disabled { pointer-events: none; }

    /* Shuffle entrance — cells pop in staggered */
    .emoji-btn.shuffle-in {
      animation: shuffleIn 350ms cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes shuffleIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Shuffle swap — flip when emoji changes */
    .emoji-btn.shuffle-swap {
      animation: shuffleSwap 250ms ease-out;
    }
    @keyframes shuffleSwap {
      0% { transform: scale(0.8) rotateY(90deg); }
      100% { transform: scale(1) rotateY(0deg); }
    }

    /* Settle — final emoji locks in */
    .emoji-btn.shuffle-settle {
      animation: shuffleSettle 400ms cubic-bezier(0.23,1,0.32,1);
    }
    @keyframes shuffleSettle {
      0% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .target-emoji.buildup {
      animation: targetPulse 0.7s ease-in-out infinite;
      opacity: 0.5;
    }
    @keyframes targetPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    @keyframes flashGreen { 0% { background: rgba(74,222,128,0.5); } 100% { background: rgba(74,222,128,0.2); } }
    @keyframes flashRed { 0% { background: rgba(248,113,113,0.4); } 100% { background: rgba(248,113,113,0.15); } }

    /* Feedback — fixed height to prevent layout jumps */
    .feedback { width: 100%; text-align: center; font-size: 20px; font-weight: 800; height: 40px; line-height: 40px; padding: 0 8px; flex-shrink: 0; visibility: visible; }
    .feedback:empty { visibility: hidden; }

    /* Watch TV overlay */
    .watch-tv { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; animation: overlayIn 250ms var(--ease-out); }
    .watch-tv.hidden { display: none !important; }
    .watch-tv-emoji { font-size: 64px; animation: bounce 1.2s var(--ease-in-out) infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes overlayIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    .watch-tv-text { font-size: 24px; font-weight: 800; color: var(--accent-light); text-align: center; }
    .watch-tv-sub { font-size: 17px; color: #94a3b8; text-align: center; }

    /* Gameover */
    .gameover-screen { background: radial-gradient(ellipse at center, #2e2a1a 0%, var(--bg) 70%); }
    .go-trophy { font-size: 80px; animation: pop 500ms cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .go-title { font-size: 38px; font-weight: 900; color: var(--accent-light); }
    .go-score { font-size: 48px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .go-personal { font-size: 20px; color: #94a3b8; text-align: center; line-height: 1.5; }
    .play-again { padding: 18px 44px; font-size: 20px; font-weight: 800; border: 2px solid var(--accent); border-radius: 14px; background: transparent; color: var(--accent-light); cursor: pointer; margin-top: 12px; transition: transform 150ms var(--ease-out); min-height: 56px; }
    .play-again:active { transform: scale(0.96); }

    /* Ready countdown overlay */
    .ready-overlay {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(10,10,10,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      backdrop-filter: blur(8px);
    }
    .ready-overlay.hidden { display: none !important; }
    .ready-number {
      font-size: 120px; font-weight: 900; color: #fbbf24;
      animation: readyPop 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ready-text {
      font-size: 28px; font-weight: 700; color: rgba(255,255,255,0.7);
      letter-spacing: 2px; text-transform: uppercase;
    }
    @keyframes readyPop { 0% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* Reconnect */
    .reconnect { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; flex-direction: column; font-size: 20px; color: #fff; z-index: 99; gap: 12px; }
    .reconnect.show { display: flex; }
    .reconnect-spin { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .waiting-anim, .watch-tv-emoji { animation: none; }
      .reconnect-spin { animation-duration: 3s; }
      .watch-tv { animation-duration: 0ms; }
      .go-trophy { animation: fadeOnly 200ms ease; }
      .emoji-btn { transition-duration: 0ms; }
      @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
<!-- Join -->
<div id="joinScreen" class="screen active">
  <div class="join-logo">🎯</div>
  <div class="join-title">Speed Tap</div>
  <div class="join-sub">Tap the correct emoji as fast as you can!</div>
  <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" aria-label="Enter your name" />
  <button id="joinBtn" class="join-btn" aria-label="Join the game">Join Game</button>
  <div id="joinError" class="error-msg" role="alert" aria-live="polite"></div>
</div>

<!-- Waiting -->
<div id="waitingScreen" class="screen">
  <div class="waiting-anim">🎯</div>
  <div class="waiting-title">You're in!</div>
  <div class="waiting-name" id="waitingName"></div>
  <div class="waiting-sub">Waiting for the host to start...</div>
</div>

<!-- Playing -->
<div id="playingScreen" class="screen playing-screen" style="position:relative;">
  <div class="top-bar">
    <div>
      <div class="top-label">Score</div>
      <div class="top-value" id="myScore">0 pts</div>
    </div>
    <div style="text-align:center">
      <div class="top-label">Correct</div>
      <div class="top-value" id="myCorrect">0/0</div>
    </div>
    <div style="text-align:right">
      <div class="top-label">Round</div>
      <div class="top-value" id="roundInfo">1/3</div>
    </div>
  </div>

  <div class="target-bar">
    <div class="target-label">Find:</div>
    <div class="target-emoji" id="targetEmoji"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <div class="grid-area" id="gridArea">
    <div id="emojiGrid" class="emoji-grid"></div>
  </div>

  <!-- Between-round overlay -->
  <div id="watchTv" class="watch-tv hidden">
    <div class="watch-tv-emoji">🎯</div>
    <div class="watch-tv-text" id="watchTvText">Round done!</div>
    <div class="watch-tv-sub" id="watchTvSub"></div>
  </div>

  <!-- Ready countdown overlay -->
  <div id="readyOverlay" class="ready-overlay hidden">
    <div class="ready-number" id="readyNumber">5</div>
    <div class="ready-text">Get Ready!</div>
  </div>
</div>

<!-- Game Over -->
<div id="gameoverScreen" class="screen gameover-screen">
  <div id="goTrophy" class="go-trophy">🎯</div>
  <div id="goTitle" class="go-title">Game Over!</div>
  <div id="goScore" class="go-score"></div>
  <div id="goPersonal" class="go-personal"></div>
</div>

<div id="reconnectOverlay" class="reconnect">
  <div class="reconnect-spin">🔄</div>
  <div>Reconnecting...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/sfx.js"></script>
<script src="/js/speed-tap-play.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
