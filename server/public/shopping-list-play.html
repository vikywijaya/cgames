<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Shopping List 🛒</title>
  <link rel="stylesheet" href="/css/play-base.css" />
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --accent: #f59e0b;
    }

    /* ── Playing ── */
    .playing-screen { justify-content: flex-start; padding: 0; gap: 0; }

    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #334155; flex-shrink: 0; }
    .top-label { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .top-value { font-size: 22px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }

    .game-hint { width: 100%; text-align: center; font-size: 20px; font-weight: 700; color: var(--accent); padding: 8px 16px; flex-shrink: 0; min-height: 36px; }

    /* Watch TV message */
    .watch-tv-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .watch-tv-emoji { font-size: 80px; animation: bounce 1.2s var(--ease-in-out) infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .watch-tv-text { font-size: 28px; font-weight: 800; color: #fff; text-align: center; }

    /* Choice grid */
    .choices-section { flex: 1; display: flex; flex-direction: column; width: 100%; overflow-y: auto; padding: 8px 12px; gap: 8px; }
    .choices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
    .choice-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      font-size: 18px; font-weight: 700;
      border: 2px solid #334155;
      border-radius: 14px;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms var(--ease-out), border-color 120ms var(--ease-out), background-color 120ms var(--ease-out);
      touch-action: manipulation;
      min-height: 56px;
    }
    .choice-btn:active:not(:disabled) { transform: scale(0.96); }
    .choice-btn.ticked { border-color: var(--accent); background: rgba(245,158,11,0.15); color: #fbbf24; }
    .choice-btn.ticked .tick-mark { display: inline; }
    .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .choice-emoji { font-size: 28px; flex-shrink: 0; }
    .tick-mark { display: none; margin-left: auto; font-size: 20px; color: var(--accent); }

    /* Submit button */
    .submit-wrap { width: 100%; padding: 12px 16px; flex-shrink: 0; background: #0f172a; border-top: 1px solid #334155; }
    .submit-btn { width: 100%; padding: 18px; font-size: 22px; font-weight: 800; border: none; border-radius: 14px; background: linear-gradient(135deg, #d97706, #f59e0b); color: #1a1200; cursor: pointer; transition: transform 150ms var(--ease-out); min-height: 60px; }
    .submit-btn:active:not(:disabled) { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Results */
    .results-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
    .result-emoji { font-size: 64px; }
    .result-title { font-size: 28px; font-weight: 900; color: var(--accent); }
    .result-stats { font-size: 20px; color: #e2e8f0; line-height: 1.8; text-align: center; }
    .result-correct { color: #4ade80; }
    .result-wrong { color: #f87171; }
    .result-missed { color: #94a3b8; }
    .result-sub { font-size: 17px; color: #94a3b8; text-align: center; }

    /* Gameover */
    .gameover-screen { background: radial-gradient(ellipse at center, #2a1f0d 0%, #0d1b2a 70%); }
    .go-trophy   { font-size: 80px; animation: pop 500ms cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .go-title    { font-size: 38px; font-weight: 900; color: var(--accent); }
    .go-score    { font-size: 48px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
    .go-personal { font-size: 20px; color: #94a3b8; text-align: center; line-height: 1.5; }
    .play-again  { padding: 18px 44px; font-size: 20px; font-weight: 800; border: 2px solid var(--accent); border-radius: 14px; background: transparent; color: var(--accent); cursor: pointer; margin-top: 12px; transition: transform 150ms var(--ease-out); min-height: 56px; }
    .play-again:active { transform: scale(0.96); }

    /* Reconnect */
    .reconnect { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); align-items: center; justify-content: center; flex-direction: column; font-size: 20px; color: #fff; z-index: 99; gap: 12px; }
    .reconnect.show { display: flex; }
    .reconnect-spin { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .waiting-anim, .watch-tv-emoji { animation: none; }
      .reconnect-spin { animation-duration: 3s; }
      .go-trophy { animation: fadeOnly 200ms ease; }
      .choice-btn, .join-btn, .submit-btn, .play-again { transition-property: background-color; transition-duration: 120ms; }
      @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
<!-- Join -->
<div id="joinScreen" class="screen active">
  <div class="join-logo">🛒</div>
  <div class="join-title">Shopping List</div>
  <div class="join-sub">Memorise the shopping list on the TV, then pick the right items!</div>
  <input id="nameInput" class="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
  <button id="joinBtn" class="join-btn">Join Game</button>
  <div id="joinError" class="error-msg" role="alert" aria-live="polite"></div>
</div>

<!-- Waiting -->
<div id="waitingScreen" class="screen">
  <div class="waiting-anim">🛒</div>
  <div class="waiting-title">You're in!</div>
  <div class="waiting-name" id="waitingName"></div>
  <div class="waiting-sub">Waiting for the host to start…</div>
</div>

<!-- Playing -->
<div id="playingScreen" class="screen playing-screen" style="position:relative;">

  <div class="top-bar">
    <div>
      <div class="top-label">Score</div>
      <div class="top-value" id="myScore">0 pts</div>
    </div>
    <div style="text-align:right">
      <div class="top-label">Round</div>
      <div class="top-value" id="roundInfo">1/3</div>
    </div>
  </div>

  <div id="gameHint" class="game-hint">Get ready!</div>

  <!-- Watch TV phase -->
  <div id="watchTvMsg" class="watch-tv-msg">
    <div class="watch-tv-emoji">📺</div>
    <div class="watch-tv-text">Watch the TV screen!</div>
  </div>

  <!-- Recall phase -->
  <div id="recallSection" class="choices-section hidden">
    <div id="choicesGrid" class="choices-grid"></div>
  </div>
  <div id="submitWrap" class="submit-wrap hidden">
    <button id="submitBtn" class="submit-btn">Done — Submit Answers</button>
  </div>

  <!-- Results after submit -->
  <div id="resultsSection" class="results-section hidden">
    <div id="resultEmoji" class="result-emoji">🛒</div>
    <div id="resultTitle" class="result-title">Submitted!</div>
    <div id="resultStats" class="result-stats"></div>
    <div id="resultSub" class="result-sub">Waiting for other players...</div>
  </div>

</div>

<!-- Game Over -->
<div id="gameoverScreen" class="screen gameover-screen">
  <div id="goTrophy" class="go-trophy">🛒</div>
  <div id="goTitle"  class="go-title">Game Over!</div>
  <div id="goScore"  class="go-score"></div>
  <div id="goPersonal" class="go-personal"></div>
</div>

<div id="reconnectOverlay" class="reconnect">
  <div class="reconnect-spin">🔄</div>
  <div>Reconnecting…</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/sfx.js"></script>
<script src="/js/shopping-list-play.js"></script>
  <script src="/js/game-rules.js"></script>
</body>
</html>
