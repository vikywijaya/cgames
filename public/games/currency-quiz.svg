<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <radialGradient id="coinShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.45)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="euroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dollarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="poundBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="yenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="rupeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="symbolGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Subtle radial glow center -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:rgba(255,215,0,0.08)"/>
    <stop offset="100%" style="stop-color:rgba(255,215,0,0)"/>
  </radialGradient>
  <rect width="512" height="512" rx="90" fill="url(#centerGlow)"/>

  <!-- Title -->
  <text x="256" y="68" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="white" letter-spacing="5" filter="url(#shadow)">CURRENCY</text>
  <text x="256" y="96" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="20" fill="rgba(255,215,0,0.85)" letter-spacing="4">QUIZ</text>

  <!-- Central coin -->
  <circle cx="256" cy="278" r="72" fill="url(#coinGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="278" r="62" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="256" cy="278" r="72" fill="url(#coinShine)"/>
  <!-- Coin edge ring -->
  <circle cx="256" cy="278" r="72" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6"/>
  <!-- $ on coin -->
  <text x="256" y="302" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="62" fill="rgba(120,80,0,0.85)">$</text>

  <!-- Euro badge - top left -->
  <circle cx="130" cy="175" r="52" fill="url(#euroBg)" filter="url(#shadow)"/>
  <circle cx="130" cy="175" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="130" y="197" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="white" filter="url(#symbolGlow)">€</text>

  <!-- Pound badge - top right -->
  <circle cx="382" cy="175" r="52" fill="url(#poundBg)" filter="url(#shadow)"/>
  <circle cx="382" cy="175" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="382" y="197" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="white" filter="url(#symbolGlow)">£</text>

  <!-- Yen badge - bottom left -->
  <circle cx="130" cy="382" r="52" fill="url(#yenBg)" filter="url(#shadow)"/>
  <circle cx="130" cy="382" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="130" y="404" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="white" filter="url(#symbolGlow)">¥</text>

  <!-- Rupee badge - bottom right -->
  <circle cx="382" cy="382" r="52" fill="url(#rupeeBg)" filter="url(#shadow)"/>
  <circle cx="382" cy="382" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="382" y="404" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="white" filter="url(#symbolGlow)">₹</text>

  <!-- Connecting arc lines from center to symbols -->
  <g opacity="0.15" stroke="white" stroke-width="1.5" fill="none">
    <line x1="200" y1="230" x2="170" y2="210"/>
    <line x1="312" y1="230" x2="344" y2="210"/>
    <line x1="200" y1="326" x2="170" y2="348"/>
    <line x1="312" y1="326" x2="344" y2="348"/>
  </g>

  <!-- Subtitle -->
  <text x="256" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.38)" letter-spacing="3">MATCH THE CURRENCY</text>
</svg>
