<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1"/>
    </linearGradient>
    <!-- Normal tile -->
    <linearGradient id="tileNormal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3a7a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2560;stop-opacity:1"/>
    </linearGradient>
    <!-- Question tile (glowing, special) -->
    <linearGradient id="tileQuestion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1"/>
    </linearGradient>
    <!-- Question glow -->
    <radialGradient id="questionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ff9800;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0"/>
    </radialGradient>
    <!-- Sequence line gradient -->
    <linearGradient id="seqLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ff9800;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="tileGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="questionTileGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="80" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="180" cy="45" r="1" fill="white" opacity="0.3"/>
  <circle cx="440" cy="60" r="2" fill="white" opacity="0.35"/>
  <circle cx="490" cy="170" r="1" fill="white" opacity="0.3"/>
  <circle cx="20" cy="390" r="1" fill="white" opacity="0.35"/>
  <circle cx="478" cy="430" r="1.5" fill="white" opacity="0.3"/>

  <!-- Title banner -->
  <rect x="26" y="32" width="460" height="70" rx="18" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="78" font-family="Arial Black, Arial" font-weight="900" font-size="35" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#titleGlow)">MISSING NUMBER</text>

  <!-- Subtitle -->
  <text x="256" y="118" font-family="Arial, sans-serif" font-size="14" fill="#90caf9" text-anchor="middle" opacity="0.7" letter-spacing="1">FIND THE PATTERN</text>

  <!-- === SEQUENCE ROW 1: 2  4  ?  8  10 === -->
  <!-- Sequence connector line -->
  <line x1="46" y1="232" x2="466" y2="232" stroke="url(#seqLine)" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>

  <!-- Tile 1: "2" -->
  <rect x="26" y="190" width="82" height="84" rx="16" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="26" y="190" width="82" height="84" rx="16" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.5"/>
  <text x="67" y="252" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" opacity="0.9">2</text>

  <!-- Arrow between tiles -->
  <text x="120" y="240" font-family="Arial" font-size="20" fill="#4facfe" text-anchor="middle" opacity="0.5">+2</text>

  <!-- Tile 2: "4" -->
  <rect x="130" y="190" width="82" height="84" rx="16" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="130" y="190" width="82" height="84" rx="16" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.5"/>
  <text x="171" y="252" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" opacity="0.9">4</text>

  <!-- Glow halo behind question tile -->
  <circle cx="256" cy="232" r="72" fill="url(#questionGlow)" opacity="0.7"/>

  <!-- Tile 3: "?" (GLOWING) -->
  <rect x="214" y="180" width="84" height="100" rx="18" fill="url(#tileQuestion)" filter="url(#questionTileGlow)"/>
  <rect x="214" y="180" width="84" height="100" rx="18" fill="none" stroke="#ffeb3b" stroke-width="3" opacity="1"/>
  <!-- Outer glow ring -->
  <rect x="208" y="174" width="96" height="112" rx="22" fill="none" stroke="#ffeb3b" stroke-width="2" opacity="0.4"/>
  <text x="256" y="252" font-family="Arial Black, Arial" font-weight="900" font-size="62" fill="#ffffff" text-anchor="middle" filter="url(#questionTileGlow)">?</text>

  <!-- Tile 4: "8" -->
  <rect x="300" y="190" width="82" height="84" rx="16" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="300" y="190" width="82" height="84" rx="16" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.5"/>
  <text x="341" y="252" font-family="Arial Black, Arial" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" opacity="0.9">8</text>

  <!-- Tile 5: "10" -->
  <rect x="404" y="190" width="82" height="84" rx="16" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="404" y="190" width="82" height="84" rx="16" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.5"/>
  <text x="445" y="252" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" opacity="0.9">10</text>

  <!-- +2 step indicators below tiles -->
  <g opacity="0.5" font-family="Arial" font-size="14" fill="#4facfe" text-anchor="middle">
    <text x="110" y="298">+2</text>
    <text x="214" y="298">+2</text>
    <text x="348" y="298">+2</text>
    <text x="425" y="298">+2</text>
  </g>
  <!-- Step lines -->
  <g stroke="#4facfe" stroke-width="1.5" opacity="0.3">
    <line x1="67" y1="276" x2="67" y2="292"/>
    <line x1="67" y1="292" x2="171" y2="292"/>
    <line x1="171" y1="276" x2="171" y2="292"/>

    <line x1="171" y1="292" x2="256" y2="292"/>
    <line x1="256" y1="282" x2="256" y2="292"/>

    <line x1="341" y1="276" x2="341" y2="292"/>
    <line x1="256" y1="292" x2="341" y2="292"/>

    <line x1="341" y1="292" x2="445" y2="292"/>
    <line x1="445" y1="276" x2="445" y2="292"/>
  </g>

  <!-- === ANSWER CHOICES ROW === -->
  <text x="256" y="348" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.5" letter-spacing="1">CHOOSE YOUR ANSWER</text>

  <!-- Choice tiles -->
  <!-- Choice: 5 -->
  <rect x="56" y="368" width="86" height="72" rx="14" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="56" y="368" width="86" height="72" rx="14" fill="none" stroke="#546e7a" stroke-width="1.5" opacity="0.5"/>
  <text x="99" y="420" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#90a4ae" text-anchor="middle">5</text>

  <!-- Choice: 6 (CORRECT - highlighted) -->
  <rect x="162" y="360" width="88" height="80" rx="14" fill="#1b5e20" filter="url(#tileGlow)"/>
  <rect x="162" y="360" width="88" height="80" rx="14" fill="none" stroke="#43e97b" stroke-width="2.5" opacity="0.9"/>
  <text x="206" y="417" font-family="Arial Black, Arial" font-weight="900" font-size="40" fill="#43e97b" text-anchor="middle" filter="url(#tileGlow)">6</text>
  <!-- Correct indicator -->
  <circle cx="234" cy="372" r="12" fill="#43e97b"/>
  <path d="M228,372 L232,377 L241,366" stroke="#1b5e20" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Choice: 7 -->
  <rect x="270" y="368" width="86" height="72" rx="14" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="270" y="368" width="86" height="72" rx="14" fill="none" stroke="#546e7a" stroke-width="1.5" opacity="0.5"/>
  <text x="313" y="420" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#90a4ae" text-anchor="middle">7</text>

  <!-- Choice: 4 -->
  <rect x="376" y="368" width="86" height="72" rx="14" fill="url(#tileNormal)" filter="url(#shadow)"/>
  <rect x="376" y="368" width="86" height="72" rx="14" fill="none" stroke="#546e7a" stroke-width="1.5" opacity="0.5"/>
  <text x="419" y="420" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#90a4ae" text-anchor="middle">4</text>

  <!-- Bottom equation hint -->
  <rect x="76" y="462" width="360" height="34" rx="10" fill="#ffffff" opacity="0.07"/>
  <text x="256" y="485" font-family="Arial, sans-serif" font-size="15" fill="#90caf9" text-anchor="middle" opacity="0.8" letter-spacing="1">2  →  4  →  6  →  8  →  10</text>

  <!-- Border -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.07"/>
</svg>
