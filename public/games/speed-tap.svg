<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1"/>
    </linearGradient>
    <!-- Gold star gradient -->
    <radialGradient id="goldStar" cx="35%" cy="25%" r="70%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#ffd600;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#ffd600;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:0"/>
    </radialGradient>
    <!-- Dim shape gradient -->
    <radialGradient id="dimShape" cx="40%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#546e7a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#263238;stop-opacity:1"/>
    </radialGradient>
    <!-- Speed line gradient -->
    <linearGradient id="speedLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd600;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ffd600;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="starGlowFilter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dimFilter">
      <feColorMatrix type="saturate" values="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Background subtle grid -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Title -->
  <rect x="50" y="34" width="412" height="68" rx="16" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="82" font-family="Arial Black, Arial" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#softGlow)">SPEED TAP</text>

  <!-- === DISTRACTOR SHAPES === -->
  <!-- Top-left dim circle -->
  <circle cx="105" cy="175" r="38" fill="url(#dimShape)" opacity="0.75"/>
  <circle cx="105" cy="165" r="10" fill="white" opacity="0.07"/>

  <!-- Top-right dim square -->
  <rect x="348" y="138" width="72" height="72" rx="12" fill="url(#dimShape)" opacity="0.75"/>
  <rect x="352" y="142" width="64" height="18" rx="6" fill="white" opacity="0.07"/>

  <!-- Mid-left dim triangle -->
  <polygon points="88,290 56,352 120,352" fill="url(#dimShape)" opacity="0.7"/>

  <!-- Mid-right dim diamond -->
  <polygon points="416,240 446,280 416,320 386,280" fill="url(#dimShape)" opacity="0.75"/>

  <!-- Bottom-left dim pentagon -->
  <polygon points="110,390 140,370 170,390 160,425 120,425" fill="url(#dimShape)" opacity="0.7"/>

  <!-- Bottom-center dim circle -->
  <circle cx="256" cy="430" r="32" fill="url(#dimShape)" opacity="0.65"/>

  <!-- Bottom-right dim square -->
  <rect x="358" y="380" width="68" height="68" rx="10" fill="url(#dimShape)" opacity="0.7"/>

  <!-- Top-center dim hexagon -->
  <polygon points="256,140 282,154 282,182 256,196 230,182 230,154" fill="url(#dimShape)" opacity="0.6"/>

  <!-- === SPEED LINES (radial, from center) === -->
  <g opacity="0.55" stroke-linecap="round">
    <!-- Right -->
    <line x1="310" y1="272" x2="420" y2="272" stroke="#ffd600" stroke-width="3"/>
    <line x1="310" y1="262" x2="400" y2="245" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <line x1="310" y1="282" x2="400" y2="299" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <!-- Left -->
    <line x1="202" y1="272" x2="92" y2="272" stroke="#ffd600" stroke-width="3"/>
    <line x1="202" y1="262" x2="112" y2="245" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <line x1="202" y1="282" x2="112" y2="299" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <!-- Up -->
    <line x1="256" y1="216" x2="256" y2="130" stroke="#ffd600" stroke-width="3"/>
    <line x1="246" y1="218" x2="228" y2="140" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <line x1="266" y1="218" x2="284" y2="140" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <!-- Down -->
    <line x1="256" y1="328" x2="256" y2="414" stroke="#ffd600" stroke-width="3"/>
    <line x1="246" y1="326" x2="228" y2="404" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <line x1="266" y1="326" x2="284" y2="404" stroke="#ffd600" stroke-width="2" opacity="0.7"/>
    <!-- Diagonals -->
    <line x1="297" y1="231" x2="368" y2="160" stroke="#ffd600" stroke-width="2.5" opacity="0.8"/>
    <line x1="215" y1="231" x2="144" y2="160" stroke="#ffd600" stroke-width="2.5" opacity="0.8"/>
    <line x1="297" y1="313" x2="368" y2="384" stroke="#ffd600" stroke-width="2.5" opacity="0.8"/>
    <line x1="215" y1="313" x2="144" y2="384" stroke="#ffd600" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- === GLOW HALO behind star === -->
  <circle cx="256" cy="272" r="110" fill="url(#starGlow)" opacity="0.8"/>
  <circle cx="256" cy="272" r="80" fill="#ffd600" opacity="0.12"/>

  <!-- === MAIN GOLD STAR === -->
  <!-- 5-point star centered at 256, 272 -->
  <g transform="translate(256,272)" filter="url(#starGlowFilter)">
    <polygon points="0,-90 21,-31 84,-28 38,15 55,76 0,43 -55,76 -38,15 -84,-28 -21,-31"
             fill="url(#goldStar)"/>
    <!-- Inner highlight -->
    <polygon points="0,-55 13,-19 51,-17 23,9 34,46 0,26 -34,46 -23,9 -51,-17 -13,-19"
             fill="#fff9c4" opacity="0.45"/>
    <!-- Center shine dot -->
    <circle r="14" fill="#ffffff" opacity="0.6"/>
    <!-- TAP text on star -->
    <text x="0" y="8" font-family="Arial Black, Arial" font-weight="900" font-size="18" fill="#e65100" text-anchor="middle" opacity="0.9">TAP!</text>
  </g>

  <!-- Tap finger cursor hint -->
  <g transform="translate(330,330)" opacity="0.85">
    <!-- Finger pointer -->
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#ffd600" opacity="0.3" transform="rotate(-30)"/>
    <text font-family="Arial" font-size="36" fill="#ffffff" text-anchor="middle" y="12" opacity="0.7">👆</text>
  </g>

  <!-- Border -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffd600" stroke-width="4" opacity="0.2"/>
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.06"/>
</svg>
