<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2d6e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#162055;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ff3d6e"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="256" y="72" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="34" fill="white" letter-spacing="4" filter="url(#shadow)">LETTER COUNT</text>

  <!-- Word card background -->
  <rect x="36" y="100" width="440" height="110" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- MISSISSIPPI letters - non-S letters -->
  <!-- M -->
  <text x="54" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">M</text>
  <!-- I -->
  <text x="104" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">I</text>
  <!-- S1 - highlighted -->
  <circle cx="145" cy="152" r="26" fill="url(#highlight)" opacity="0.9" filter="url(#glowOrange)"/>
  <text x="145" y="176" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white">S</text>
  <!-- S2 - highlighted -->
  <circle cx="181" cy="152" r="26" fill="url(#highlight)" opacity="0.9" filter="url(#glowOrange)"/>
  <text x="181" y="176" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white">S</text>
  <!-- I -->
  <text x="204" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">I</text>
  <!-- S3 - highlighted -->
  <circle cx="249" cy="152" r="26" fill="url(#highlight)" opacity="0.9" filter="url(#glowOrange)"/>
  <text x="249" y="176" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white">S</text>
  <!-- S4 - highlighted -->
  <circle cx="286" cy="152" r="26" fill="url(#highlight)" opacity="0.9" filter="url(#glowOrange)"/>
  <text x="286" y="176" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white">S</text>
  <!-- I -->
  <text x="308" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">I</text>
  <!-- P -->
  <text x="330" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">P</text>
  <!-- P -->
  <text x="368" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">P</text>
  <!-- I -->
  <text x="410" y="176" font-family="Arial Black, Arial" font-weight="900" font-size="58" fill="white" opacity="0.9">I</text>

  <!-- Question label -->
  <text x="256" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.6)" letter-spacing="2">How many times does</text>

  <!-- Target letter display -->
  <rect x="166" y="262" width="80" height="80" rx="16" fill="url(#highlight)" filter="url(#shadow)"/>
  <text x="206" y="325" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="64" fill="white">S</text>

  <!-- Arrow -->
  <text x="270" y="315" font-family="Arial" font-size="36" fill="rgba(255,255,255,0.7)">appear?</text>

  <!-- Counter badge -->
  <circle cx="390" cy="360" r="52" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <circle cx="390" cy="360" r="44" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
  <text x="390" y="380" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="56" fill="white">4</text>

  <!-- Small stars -->
  <text x="80" y="370" font-size="22" fill="#ffd700" opacity="0.8">★</text>
  <text x="110" y="395" font-size="14" fill="#ffd700" opacity="0.6">★</text>
  <text x="60" y="400" font-size="16" fill="#ffd700" opacity="0.5">★</text>

  <!-- Subtitle -->
  <text x="256" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.45)" letter-spacing="3">COUNT THE LETTERS</text>
</svg>
