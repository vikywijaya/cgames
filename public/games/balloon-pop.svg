<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1" />
    </linearGradient>
    <!-- Red balloon gradient -->
    <radialGradient id="redBalloon" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e03030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </radialGradient>
    <!-- Yellow balloon gradient -->
    <radialGradient id="yellowBalloon" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#fff176;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#f9a825;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1" />
    </radialGradient>
    <!-- Green balloon gradient -->
    <radialGradient id="greenBalloon" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </radialGradient>
    <!-- Blue balloon gradient -->
    <radialGradient id="blueBalloon" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#90caf9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </radialGradient>
    <!-- Pink balloon gradient -->
    <radialGradient id="pinkBalloon" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#f8bbd9;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e91e8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880e4f;stop-opacity:1" />
    </radialGradient>
    <!-- Pop glow -->
    <radialGradient id="popGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0" />
    </radialGradient>
    <!-- Title glow filter -->
    <filter id="titleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle star field background -->
  <circle cx="60" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="150" cy="40" r="1" fill="white" opacity="0.3"/>
  <circle cx="420" cy="55" r="2" fill="white" opacity="0.4"/>
  <circle cx="470" cy="120" r="1" fill="white" opacity="0.3"/>
  <circle cx="490" cy="390" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="30" cy="350" r="1" fill="white" opacity="0.3"/>
  <circle cx="80" cy="450" r="2" fill="white" opacity="0.3"/>
  <circle cx="440" cy="460" r="1.5" fill="white" opacity="0.4"/>

  <!-- Title banner -->
  <rect x="40" y="38" width="432" height="68" rx="16" fill="#ffffff" opacity="0.12"/>
  <text x="256" y="86" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" filter="url(#titleGlow)" letter-spacing="2">BALLOON POP</text>

  <!-- === BALLOON 1: Red (left, high) === -->
  <!-- String -->
  <path d="M140 420 Q132 370 136 330 Q140 290 138 260" stroke="#cc0000" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- Balloon body -->
  <ellipse cx="140" cy="218" rx="42" ry="52" fill="url(#redBalloon)"/>
  <!-- Highlight -->
  <ellipse cx="126" cy="200" rx="12" ry="16" fill="white" opacity="0.25" transform="rotate(-15, 126, 200)"/>
  <!-- Knot -->
  <ellipse cx="140" cy="270" rx="6" ry="5" fill="#8b0000"/>

  <!-- === BALLOON 2: Yellow (center-left, mid) === -->
  <path d="M210 420 Q204 375 208 340 Q212 305 210 278" stroke="#e65100" stroke-width="2" fill="none" opacity="0.8"/>
  <ellipse cx="210" cy="235" rx="40" ry="50" fill="url(#yellowBalloon)"/>
  <ellipse cx="196" cy="218" rx="11" ry="15" fill="white" opacity="0.25" transform="rotate(-15, 196, 218)"/>
  <ellipse cx="210" cy="285" rx="6" ry="5" fill="#e65100"/>

  <!-- === BALLOON 3: Green (center, tallest) === -->
  <path d="M290" stroke="#1b5e20" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M290 420 Q282 360 285 315 Q288 275 286 248" stroke="#1b5e20" stroke-width="2" fill="none" opacity="0.8"/>
  <ellipse cx="286" cy="200" rx="44" ry="55" fill="url(#greenBalloon)"/>
  <ellipse cx="272" cy="182" rx="12" ry="17" fill="white" opacity="0.25" transform="rotate(-15, 272, 182)"/>
  <ellipse cx="286" cy="255" rx="6" ry="5" fill="#1b5e20"/>

  <!-- === BALLOON 4: Blue (center-right) === -->
  <path d="M370 420 Q364 368 368 328 Q372 295 370 268" stroke="#0d47a1" stroke-width="2" fill="none" opacity="0.8"/>
  <ellipse cx="370" cy="222" rx="42" ry="52" fill="url(#blueBalloon)"/>
  <ellipse cx="356" cy="204" rx="12" ry="16" fill="white" opacity="0.25" transform="rotate(-15, 356, 204)"/>
  <ellipse cx="370" cy="274" rx="6" ry="5" fill="#0d47a1"/>

  <!-- === BALLOON 5: Pink (right, high) === -->
  <path d="M445 420 Q438 365 442 318 Q446 278 444 245" stroke="#880e4f" stroke-width="2" fill="none" opacity="0.8"/>
  <ellipse cx="444" cy="198" rx="38" ry="48" fill="url(#pinkBalloon)"/>
  <ellipse cx="431" cy="182" rx="11" ry="14" fill="white" opacity="0.25" transform="rotate(-15, 431, 182)"/>
  <ellipse cx="444" cy="246" rx="5" ry="5" fill="#880e4f"/>

  <!-- === POP EFFECT on yellow balloon === -->
  <!-- Glow halo -->
  <circle cx="210" cy="240" r="60" fill="url(#popGlow)" opacity="0.7"/>
  <!-- Star burst spikes -->
  <g transform="translate(210,240)">
    <!-- Main star shape -->
    <polygon points="0,-48 8,-18 30,-30 18,-8 48,0 18,8 30,30 8,18 0,48 -8,18 -30,30 -18,8 -48,0 -18,-8 -30,-30 -8,-18"
             fill="#ffeb3b" opacity="0.95"/>
    <!-- Inner star -->
    <polygon points="0,-28 5,-10 18,-18 10,-5 28,0 10,5 18,18 5,10 0,28 -5,10 -18,18 -10,5 -28,0 -10,-5 -18,-18 -5,-10"
             fill="#ffffff" opacity="0.9"/>
    <!-- Center dot -->
    <circle r="8" fill="#fff176"/>
    <!-- Bang text -->
    <text x="0" y="5" font-family="Arial Black, Arial" font-weight="900" font-size="11" fill="#e65100" text-anchor="middle">POP!</text>
  </g>

  <!-- Ground / bottom area with grass hints -->
  <rect x="0" y="420" width="512" height="92" rx="0" fill="#0d2b6b" opacity="0.5"/>
  <rect x="0" y="440" width="512" height="72" rx="0" fill="#1b3a1b" opacity="0.35"/>
  <!-- Grass blades -->
  <g fill="#2e7d32" opacity="0.7">
    <ellipse cx="30" cy="440" rx="8" ry="20" transform="rotate(-10,30,440)"/>
    <ellipse cx="55" cy="438" rx="7" ry="18" transform="rotate(8,55,438)"/>
    <ellipse cx="80" cy="442" rx="8" ry="22" transform="rotate(-5,80,442)"/>
    <ellipse cx="110" cy="440" rx="7" ry="19" transform="rotate(12,110,440)"/>
    <ellipse cx="140" cy="439" rx="8" ry="21" transform="rotate(-8,140,439)"/>
    <ellipse cx="170" cy="441" rx="7" ry="18" transform="rotate(6,170,441)"/>
    <ellipse cx="200" cy="440" rx="8" ry="20" transform="rotate(-12,200,440)"/>
    <ellipse cx="230" cy="438" rx="7" ry="19" transform="rotate(9,230,438)"/>
    <ellipse cx="260" cy="441" rx="8" ry="22" transform="rotate(-6,260,441)"/>
    <ellipse cx="290" cy="440" rx="7" ry="20" transform="rotate(11,290,440)"/>
    <ellipse cx="320" cy="439" rx="8" ry="21" transform="rotate(-9,320,439)"/>
    <ellipse cx="350" cy="441" rx="7" ry="18" transform="rotate(7,350,441)"/>
    <ellipse cx="380" cy="440" rx="8" ry="20" transform="rotate(-11,380,440)"/>
    <ellipse cx="410" cy="438" rx="7" ry="19" transform="rotate(5,410,438)"/>
    <ellipse cx="440" cy="441" rx="8" ry="22" transform="rotate(-7,440,441)"/>
    <ellipse cx="470" cy="440" rx="7" ry="20" transform="rotate(10,470,440)"/>
    <ellipse cx="495" cy="439" rx="8" ry="18" transform="rotate(-13,495,439)"/>
  </g>

  <!-- Rounded corner mask (re-clip) -->
  <rect width="512" height="512" rx="90" ry="90" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.08"/>
</svg>
