<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a7a"/>
      <stop offset="100%" style="stop-color:#0d2255"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#a0a0b0"/>
    </linearGradient>
    <linearGradient id="pyramidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#a07820"/>
    </linearGradient>
    <linearGradient id="qBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a70"/>
      <stop offset="100%" style="stop-color:#0f1e45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="towerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Sky panel -->
  <rect x="36" y="110" width="440" height="300" rx="20" fill="url(#skyGrad)" opacity="0.6"/>

  <!-- Stars in sky -->
  <circle cx="90" cy="145" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="150" cy="130" r="1" fill="white" opacity="0.6"/>
  <circle cx="200" cy="150" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="320" cy="135" r="1" fill="white" opacity="0.6"/>
  <circle cx="380" cy="148" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="440" cy="130" r="1" fill="white" opacity="0.5"/>
  <circle cx="460" cy="160" r="1.5" fill="white" opacity="0.6"/>
  <!-- Moon -->
  <circle cx="430" cy="148" r="14" fill="#fffde0" opacity="0.85"/>
  <circle cx="438" cy="143" r="11" fill="url(#skyGrad)" opacity="0.95"/>

  <!-- Title -->
  <text x="256" y="72" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="38" fill="white" letter-spacing="5" filter="url(#shadow)">LANDMARK</text>
  <text x="256" y="100" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="20" fill="rgba(255,200,100,0.85)" letter-spacing="4">QUIZ</text>

  <!-- Ground -->
  <rect x="36" y="370" width="440" height="40" rx="0" fill="url(#groundGrad)" opacity="0.8"/>
  <rect x="36" y="390" width="440" height="20" rx="0" fill="url(#bg)" opacity="0.9"/>

  <!-- === EIFFEL TOWER (left side) === -->
  <g transform="translate(100, 135)" filter="url(#towerGlow)">
    <!-- Main tower shape -->
    <!-- Base legs -->
    <polygon points="0,230 22,230 36,170 -14,170" fill="url(#towerGrad)" opacity="0.95"/>
    <polygon points="84,230 62,230 48,170 98,170" fill="url(#towerGrad)" opacity="0.95"/>
    <!-- Lower arch -->
    <path d="M-14,170 Q42,130 98,170" fill="none" stroke="url(#towerGrad)" stroke-width="5"/>
    <!-- Middle section -->
    <polygon points="22,170 62,170 58,110 26,110" fill="url(#towerGrad)" opacity="0.95"/>
    <!-- Middle platform -->
    <rect x="16" y="108" width="52" height="8" rx="2" fill="#b0b0c0"/>
    <!-- Upper section -->
    <polygon points="28,108 56,108 50,60 34,60" fill="url(#towerGrad)" opacity="0.95"/>
    <!-- Upper platform -->
    <rect x="26" y="58" width="32" height="6" rx="2" fill="#b0b0c0"/>
    <!-- Spire -->
    <polygon points="34,58 50,58 42,0" fill="url(#towerGrad)" opacity="0.95"/>
    <!-- Antenna top -->
    <circle cx="42" cy="0" r="3" fill="#ffd700"/>
    <!-- Window lights -->
    <rect x="34" y="78" width="4" height="4" rx="1" fill="#ffd700" opacity="0.8"/>
    <rect x="44" y="78" width="4" height="4" rx="1" fill="#ffd700" opacity="0.8"/>
    <rect x="30" y="130" width="4" height="6" rx="1" fill="#ffd700" opacity="0.6"/>
    <rect x="50" y="130" width="4" height="6" rx="1" fill="#ffd700" opacity="0.6"/>
  </g>

  <!-- === PYRAMID (right side) === -->
  <g transform="translate(298, 165)" filter="url(#shadow)">
    <!-- Main pyramid -->
    <polygon points="90,205 0,205 90,-5" fill="url(#pyramidGrad)" opacity="0.95"/>
    <!-- Shadow face -->
    <polygon points="90,205 180,205 90,-5" fill="#8a6018" opacity="0.85"/>
    <!-- Small pyramid next to it -->
    <polygon points="155,205 115,205 135,165" fill="#c8992a" opacity="0.8"/>
    <!-- Lines on pyramid face -->
    <line x1="90" y1="-5" x2="20" y2="185" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <line x1="90" y1="-5" x2="50" y2="195" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
    <line x1="90" y1="-5" x2="130" y2="195" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    <!-- Capstone -->
    <polygon points="90,-5 82,20 98,20" fill="#ffd700" opacity="0.9"/>
    <!-- Base shadow -->
    <ellipse cx="90" cy="205" rx="90" ry="8" fill="rgba(0,0,0,0.25)"/>
  </g>

  <!-- Question mark badge center -->
  <circle cx="256" cy="278" r="44" fill="url(#qBadge)" filter="url(#shadow)"/>
  <circle cx="256" cy="278" r="38" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <text x="256" y="297" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="50" fill="white">?</text>

  <!-- Subtitle -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.38)" letter-spacing="3">WHICH COUNTRY?</text>
</svg>
