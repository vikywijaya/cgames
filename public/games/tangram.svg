<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d2b6b"/>
    </linearGradient>
    <!-- Piece gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#cc0000"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4488ff"/>
      <stop offset="100%" style="stop-color:#2255cc"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#44cc44"/>
      <stop offset="100%" style="stop-color:#228822"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd00"/>
      <stop offset="100%" style="stop-color:#cc9900"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8800"/>
      <stop offset="100%" style="stop-color:#cc5500"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cc44ff"/>
      <stop offset="100%" style="stop-color:#8800cc"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ccdd"/>
      <stop offset="100%" style="stop-color:#007788"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="pieceShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.04" fill="white">
    <circle cx="64" cy="64" r="3"/><circle cx="128" cy="64" r="3"/><circle cx="192" cy="64" r="3"/>
    <circle cx="256" cy="64" r="3"/><circle cx="320" cy="64" r="3"/><circle cx="384" cy="64" r="3"/>
    <circle cx="448" cy="64" r="3"/>
    <circle cx="64" cy="128" r="3"/><circle cx="128" cy="128" r="3"/><circle cx="192" cy="128" r="3"/>
    <circle cx="256" cy="128" r="3"/><circle cx="320" cy="128" r="3"/><circle cx="384" cy="128" r="3"/>
    <circle cx="448" cy="128" r="3"/>
    <circle cx="64" cy="192" r="3"/><circle cx="128" cy="192" r="3"/><circle cx="192" cy="192" r="3"/>
    <circle cx="256" cy="192" r="3"/><circle cx="320" cy="192" r="3"/><circle cx="384" cy="192" r="3"/>
    <circle cx="448" cy="192" r="3"/>
    <circle cx="64" cy="256" r="3"/><circle cx="128" cy="256" r="3"/><circle cx="192" cy="256" r="3"/>
    <circle cx="256" cy="256" r="3"/><circle cx="320" cy="256" r="3"/><circle cx="384" cy="256" r="3"/>
    <circle cx="448" cy="256" r="3"/>
    <circle cx="64" cy="320" r="3"/><circle cx="128" cy="320" r="3"/><circle cx="192" cy="320" r="3"/>
    <circle cx="256" cy="320" r="3"/><circle cx="320" cy="320" r="3"/><circle cx="384" cy="320" r="3"/>
    <circle cx="448" cy="320" r="3"/>
  </g>

  <!-- Title -->
  <text x="256" y="72" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="44" fill="white" letter-spacing="6" filter="url(#shadow)">TANGRAM</text>

  <!-- ===== RABBIT SILHOUETTE (right side, assembled) ===== -->
  <!-- Assembled rabbit using tangram pieces, scaled ~110px unit -->
  <!-- Unit = 70px for this arrangement -->

  <!-- Large triangle 1 - body (red) -->
  <polygon points="290,370 430,370 360,230" fill="url(#redGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Large triangle 2 - body base (blue) -->
  <polygon points="290,370 220,300 290,230" fill="url(#blueGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Medium triangle - head (green) -->
  <polygon points="340,230 360,230 350,175" fill="url(#greenGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Small triangle 1 - left ear (yellow) -->
  <polygon points="318,230 340,230 329,185" fill="url(#yellowGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Small triangle 2 - right ear (orange) -->
  <polygon points="360,230 376,230 368,190" fill="url(#orangeGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Square - rabbit face/chest (purple) -->
  <rect x="308" y="230" width="52" height="52" rx="4" fill="url(#purpleGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" transform="rotate(0,334,256)"/>

  <!-- Parallelogram - tail/foot (cyan) -->
  <polygon points="410,350 450,350 430,370 390,370" fill="url(#cyanGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ===== LOOSE PIECES (left side, scattered) ===== -->
  <!-- Scattered pieces to show the game concept -->

  <!-- Loose piece 1 - small triangle (yellow), rotated -->
  <polygon points="80,160 130,160 105,210" fill="url(#yellowGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" transform="rotate(-20,105,185)"/>

  <!-- Loose piece 2 - square (purple) -->
  <rect x="55" y="230" width="56" height="56" rx="4" fill="url(#purpleGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" transform="rotate(15,83,258)"/>

  <!-- Loose piece 3 - medium triangle (green) -->
  <polygon points="80,330 150,330 115,265" fill="url(#greenGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" transform="rotate(10,115,298)"/>

  <!-- Loose piece 4 - parallelogram (cyan) -->
  <polygon points="100,390 160,390 145,420 85,420" fill="url(#cyanGrad)" filter="url(#pieceShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" transform="rotate(-8,122,405)"/>

  <!-- Arrow indicating assembly -->
  <g opacity="0.6">
    <line x1="180" y1="295" x2="215" y2="295" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="215,289 226,295 215,301" fill="white"/>
  </g>

  <!-- Subtitle -->
  <text x="256" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" letter-spacing="2">7 PIECES · ENDLESS SHAPES</text>

  <!-- Bottom tagline -->
  <text x="256" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.35)" letter-spacing="3">FILL THE SILHOUETTE</text>
</svg>
