<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aad4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000033" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow in center -->
  <radialGradient id="centerGlow" cx="50%" cy="55%" r="50%">
    <stop offset="0%" style="stop-color:#2a2a8e;stop-opacity:0.6" />
    <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:0" />
  </radialGradient>
  <rect width="512" height="512" rx="90" ry="90" fill="url(#centerGlow)"/>

  <!-- Scattered operator symbols - background decoration -->
  <!-- Top left + -->
  <text x="52" y="118" font-family="Arial Black, Arial" font-size="52" font-weight="900"
        fill="#ff6b9d" opacity="0.35" transform="rotate(-15,52,118)">+</text>
  <!-- Top right - -->
  <text x="400" y="105" font-family="Arial Black, Arial" font-size="52" font-weight="900"
        fill="#6bddff" opacity="0.35" transform="rotate(12,400,105)">-</text>
  <!-- Bottom left × -->
  <text x="42" y="390" font-family="Arial Black, Arial" font-size="52" font-weight="900"
        fill="#ffe066" opacity="0.35" transform="rotate(20,42,390)">×</text>
  <!-- Bottom right + -->
  <text x="418" y="405" font-family="Arial Black, Arial" font-size="52" font-weight="900"
        fill="#a0ff9d" opacity="0.35" transform="rotate(-18,418,405)">+</text>
  <!-- Mid left ÷ -->
  <text x="30" y="255" font-family="Arial Black, Arial" font-size="44" font-weight="900"
        fill="#ff9d6b" opacity="0.28" transform="rotate(8,30,255)">÷</text>
  <!-- Mid right = -->
  <text x="435" y="260" font-family="Arial Black, Arial" font-size="44" font-weight="900"
        fill="#c8b4ff" opacity="0.28" transform="rotate(-10,435,260)">＝</text>

  <!-- Title "QUICK MATHS" at top -->
  <rect x="60" y="48" width="392" height="58" rx="12" ry="12"
        fill="#ffffff" opacity="0.08"/>
  <text x="256" y="90" font-family="Arial Black, Arial" font-size="34" font-weight="900"
        fill="url(#textGrad)" text-anchor="middle" letter-spacing="3"
        filter="url(#glow)">QUICK MATHS</text>

  <!-- Lightning bolt (large, center-left) -->
  <!-- Bold yellow lightning polygon -->
  <polygon points="230,155 195,270 235,270 200,370 300,235 255,235 295,155"
           fill="url(#lightningGrad)" filter="url(#softGlow)" opacity="0.95"/>
  <!-- Lightning inner highlight -->
  <polygon points="230,155 210,240 240,240 215,320 280,240 250,240 275,168"
           fill="#fff8cc" opacity="0.55"/>

  <!-- Main equation card -->
  <rect x="258" y="178" width="198" height="108" rx="18" ry="18"
        fill="#ffffff" opacity="0.10" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Equation text: 7 × 8 = ? -->
  <text x="357" y="224" font-family="Arial Black, Arial" font-size="36" font-weight="900"
        fill="#ffffff" text-anchor="middle" filter="url(#glow)">7 × 8</text>
  <text x="357" y="268" font-family="Arial Black, Arial" font-size="36" font-weight="900"
        fill="#ffe066" text-anchor="middle" filter="url(#glow)">=  ?</text>

  <!-- Speed lines suggesting motion -->
  <line x1="80" y1="205" x2="148" y2="205" stroke="#6bddff" stroke-width="3"
        stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="68" y1="222" x2="152" y2="222" stroke="#6bddff" stroke-width="2"
        stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="80" y1="238" x2="142" y2="238" stroke="#6bddff" stroke-width="2"
        stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Small decorative math circles -->
  <circle cx="110" cy="340" r="28" fill="#ff6b9d" opacity="0.18"/>
  <text x="110" y="349" font-family="Arial Black, Arial" font-size="22" font-weight="900"
        fill="#ff6b9d" opacity="0.75" text-anchor="middle">+</text>

  <circle cx="400" cy="165" r="26" fill="#ffe066" opacity="0.18"/>
  <text x="400" y="174" font-family="Arial Black, Arial" font-size="22" font-weight="900"
        fill="#ffe066" opacity="0.75" text-anchor="middle">×</text>

  <circle cx="390" cy="340" r="24" fill="#a0ff9d" opacity="0.18"/>
  <text x="390" y="349" font-family="Arial Black, Arial" font-size="22" font-weight="900"
        fill="#a0ff9d" opacity="0.75" text-anchor="middle">-</text>

  <!-- Bottom tagline -->
  <rect x="120" y="408" width="272" height="42" rx="10" ry="10"
        fill="#ffe066" opacity="0.18"/>
  <text x="256" y="435" font-family="Arial, sans-serif" font-size="18" font-weight="700"
        fill="#ffe066" text-anchor="middle" letter-spacing="2">SOLVE IT FAST!</text>

  <!-- Bottom glow bar -->
  <rect x="90" y="462" width="332" height="4" rx="2"
        fill="#ffe066" opacity="0.35"/>
</svg>
